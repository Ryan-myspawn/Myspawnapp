onst PROFILE_STORE = 'myspawn.profile.v1';\n\nconst FACE_LABELS = { race:'Race & Ethnicity', shape:'Face Shape', nose:'Nose', jaw:'Jawline',\n  eye:'Eye Colour', skin:'Skin Tone', haircolor:'Hair Colour', hairstyle:'Hair Style',\n  hairline:'Hairline', expression:'Default Expression' };\n\n/* Demo content stands in for rooms this build does not own yet. */\nconst DEMO_VALUES = {\n  knowledge:{ text:'Full access to my MySpawn-recorded memories as immersive experiences — but no AI reconstruction of me.',\n              em:'MySpawn-recorded', tags:['Memories','Immersive'], altTags:['No AI reconstruction'] },\n  motivation:{ text:'My story and voice — preserved for future family.', em:'preserved' },\n  consent:{ text:'Shared with another person only with their fully informed, independent consent at the relevant time.',\n            strong:'only with their fully informed, independent consent' }\n};\n\n/* Emphasis without innerHTML, so stored copy can never inject markup. */\nfunction emphasise(node, o, cls) {\n  if (!o) return node;\n  const needle = o.em || o.strong;\n  const i = needle ? o.text.indexOf(needle) : -1;\n  if (i \u003c 0) { node.textContent = o.text; return node; }\n  node.appendChild(document.createTextNode(o.text.slice(0, i)));\n  const mark = document.createElement(o.em ? 'em' : 'strong');\n  if (cls) mark.className = cls;\n  mark.textContent = needle;\n  node.appendChild(mark);\n  node.appendChild(document.createTextNode(o.text.slice(i + needle.length)));\n  return node;\n}\n\nconst state = { face:{}, body:{}, values:{ ...DEMO_VALUES }, notes:[],\n                birth:'2050-06-14', filter:'all', units:'ft', noteFormOpen:false };\n\nfunction readStore(key) {\n  try { const v = JSON.parse(localStorage.getItem(key) || 'null');\n    return v && typeof v === 'object' ? v : {}; } catch (_) { return {}; }\n}\nfunction loadProfile() {\n  state.face = readStore(FACE_STORE);\n  if (!Object.keys(state.face).length) state.face = readStore(FACE_STORE_LEGACY);\n  state.body = readStore(BODY_STORE);\n  const own = readStore(PROFILE_STORE);\n  if (typeof own.birth === 'string' && /^\\d{4}-\\d{2}-\\d{2}$/.test(own.birth)) state.birth = own.birth;\n  if (Array.isArray(own.notes)) state.notes = own.notes\n    .filter(x => x && typeof x.text === 'string')\n    .slice(0, 50)\n    .map(x => ({ text:x.text.slice(0, 600), at:Number(x.at) || null }));\n  if (own.units === 'cm' || own.units === 'ft') state.units = own.units;\n}\nfunction saveProfile() {\n  try { localStorage.setItem(PROFILE_STORE, JSON.stringify(\n    { birth:state.birth, notes:state.notes, units:state.units })); } catch (_) {}\n}\n\nlet NAME = 'Ryan';\n(function () {\n  const raw = new URLSearchParams((window.__fbdSearch || location.search)).get('name');\n  const clean = (raw || '').trim().replace(/[\u003c>\"'&\\\\/]/g, '').slice(0, 24);\n  if (clean) NAME = clean;\n})();\n\n/* Room navigation — inside the combined flow (fbd) the parent shell swaps\n   steps; standalone, we navigate to the sibling 1.11 files. */\nconst ROOM_HREF = { face:'face_myspawn_1.11.html', body:'body_traits_1.11.html' };\nfunction goRoom(room) {\n  if (!ROOM_HREF[room]) return;\n  if (window.parent !== window) {\n    parent.postMessage({ fbd:'goto', target:room }, '*');\n    return;\n  }\n  location.href = ROOM_HREF[room] + '?name=' + encodeURIComponent(NAME);\n}\n\n/* ═══════════ 4 · DERIVED ═══════════ */\nconst fmtFt = i => `${Math.floor(i/12)}'${i%12}\"`;\nconst fmtHeight = i => i == null ? null\n  : state.units === 'cm' ? `${Math.round(i*2.54)} cm` : fmtFt(i);\nconst abilityCount = () => Array.isArray(state.body.abilities) ? state.body.abilities.length : 0;\n\nfunction faceTraitCount() { return Object.keys(FACE_LABELS).filter(k => state.face[k]).length; }\n/* Sex is decided before the body room (1.11), so it no longer counts as a\n   choice the visitor still owes — physique is build, height, abs. */\nfunction bodyTraitCount() {\n  return ['build','abs'].filter(k => state.body[k]).length + (state.body.height != null ? 1 : 0);\n}\nfunction valuesCount() { return Object.values(state.values).filter(v => v && v.text).length; }\nfunction traitTotal() { return faceTraitCount() + bodyTraitCount() + abilityCount(); }\n\n/* Completeness is what a profile page is for: what is set, what is missing. */\nfunction completeness() {\n  const parts = [\n    { key:'face',  label:'Face traits',   done:faceTraitCount(), total:10, room:'face' },\n    { key:'body',  label:'Physique',      done:bodyTraitCount(), total:3,  room:'body' },\n    { key:'path',  label:'Ability path',  done:state.body.path ? 1 : 0, total:1, room:'body' },\n    { key:'values',label:'Legacy statements', done:valuesCount(), total:3, room:null }\n  ];\n  const done = parts.reduce((a, p) => a + Math.min(p.done, p.total), 0);\n  const total = parts.reduce((a, p) => a + p.total, 0);\n  return { pct:Math.round(done/total*100), parts, gaps:parts.filter(p => p.done \u003c p.total) };\n}\n\nconst el = (t, c, h) => { const e = document.createElement(t);\n  if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };\nconst esc = s => String(s).replace(/[&\u003c>\"']/g, c =>\n  ({ '&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#039;' }[c]));\n\n/* ═══════════ 5 · CARDS ═══════════ */\nconst FILTERS = [\n  { id:'all',        label:'All' },\n  { id:'physique',   label:'Physique' },\n  { id:'legacy',     label:'Legacy' }\n];\n\nfunction rowsBlock(rows) {\n  const w = el('div', 'rows');\n  rows.forEach(([ico, k, v]) => {\n    const r = el('div', 'trow');\n    const kk = el('span', 'k', ico && ICO[ico] ? I(ICO[ico], 14) : '');\n    kk.appendChild(document.createTextNode(k));\n    const vv = el('span', 'v' + (v ? '' : ' empty'));\n    vv.textContent = v || 'Not set yet';\n    r.append(kk, vv);\n    w.appendChild(r);\n  });\n  return w;\n}\nfunction cardShell(sec, ico, title, meta) {\n  const c = el('section', 'card');\n  c.dataset.sec = sec;\n  c.innerHTML = `\u003cdiv class=\"card-hd\">\n      \u003cspan class=\"card-ico\">${I(ICO[ico] || ICO.spark, 15)}\u003c/span>\n      \u003ch2 class=\"card-ttl\">\u003c/h2>\u003cspan class=\"card-meta\">\u003c/span>\u003c/div>`;\n  c.querySelector('.card-ttl').textContent = title;\n  c.querySelector('.card-meta').textContent = meta || '';\n  return c;\n}\nfunction footer(note, linkText, room) {\n  const f = el('div', 'card-foot');\n  f.appendChild(el('span', 'card-note', '')).textContent = note || '';\n  if (linkText) {\n    const a = el('a', 'edit-link');\n    a.href = room && ROOM_HREF[room]\n      ? ROOM_HREF[room] + '?name=' + encodeURIComponent(NAME) : '#';\n    a.appendChild(document.createTextNode(linkText));\n    a.insertAdjacentHTML('beforeend',\n      '\u003csvg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14\"/>\u003cpath d=\"m12 5 7 7-7 7\"/>\u003c/svg>');\n    a.addEventListener('click', e => {\n      e.preventDefault();\n      if (room) goRoom(room); else toast('That room is not built yet');\n    });\n    f.appendChild(a);\n  }\n  return f;\n}\n\nfunction buildFeed() {\n  const feed = document.getElementById('feed');\n  feed.textContent = '';\n\n  /* ── The Frame — the live figure replaces the old empty placeholder ── */\n  {\n    const c = cardShell('physique', 'frame', 'The Frame', 'Physique');\n    const bd = el('div', 'card-bd');\n    const viz = el('div', 'viz');\n    const bodyCell = el('div', 'viz-cell body');\n    bodyCell.innerHTML = `\u003cdiv class=\"art\">${renderBody(state.body, { uid:'pb', sw:4.4 })}\u003c/div>\n      \u003cspan class=\"viz-tag\">Body\u003c/span>`;\n    if (state.body.height != null)\n      bodyCell.insertAdjacentHTML('beforeend',\n        `\u003cdiv class=\"viz-h\">\u003cdiv class=\"n\">${esc(fmtHeight(state.body.height))}\u003c/div>\u003cdiv class=\"l\">Height\u003c/div>\u003c/div>`);\n    const faceCell = el('div', 'viz-cell face');\n    faceCell.innerHTML = `\u003cdiv class=\"art\">${renderFace(state.face, 'pf', '8 8 184 184')}\u003c/div>\n      \u003cspan class=\"viz-tag\">Face\u003c/span>`;\n    viz.append(bodyCell, faceCell);\n\n    const ms = el('div', 'mini-stats');\n    [['Build', state.body.build], ['Height', fmtHeight(state.body.height)], ['Abs', state.body.abs]]\n      .forEach(([l, v]) => {\n        const s = el('div', 'mstat');\n        s.appendChild(el('div', 'l', '')).textContent = l;\n        s.appendChild(el('div', 'v' + (v ? '' : ' empty'))).textContent = v || 'From photo';\n        ms.appendChild(s);\n      });\n    bd.append(viz, ms);\n    c.append(bd, footer('Conceptual — not a guarantee', 'Edit physique', 'body'));\n    feed.appendChild(c);\n  }\n\n  /* ── Face traits ── */\n  {\n    const c = cardShell('physique', 'face', 'Face & Identity Traits', `${faceTraitCount()} / 10`);\n    const bd = el('div', 'card-bd');\n    bd.appendChild(rowsBlock(Object.entries(FACE_LABELS)\n      .map(([k, label]) => [null, label, state.face[k] || null])));\n    c.append(bd, footer('', 'Edit face', 'face'));\n    feed.appendChild(c);\n  }\n\n  /* ── Ability path ── */\n  {\n    const path = state.body.path, style = state.body.style;\n    const label = !path ? null\n      : path === 'natural' ? 'Natural human — no enhancements'\n      : style === 'open' ? 'Enhanced — inherits the human standard of their time'\n      : style === 'specific' ? `Enhanced — ${abilityCount()} hand-picked` : 'Enhanced — not yet specified';\n    const c = cardShell('physique', 'spark', 'Ability Path', path ? 'Chosen' : 'Not set');\n    const bd = el('div', 'card-bd');\n    bd.appendChild(rowsBlock([['bolt', 'Path', label]]));\n    if (abilityCount()) {\n      const tags = el('div', 'tags');\n      state.body.abilities.forEach(k => {\n        const custom = (state.body.custom || []).find(c2 => c2.key === k);\n        const t = el('span', 'tag alt');\n        t.textContent = custom ? custom.name : prettyAbility(k);\n        tags.appendChild(t);\n      });\n      bd.appendChild(tags);\n    }\n    c.append(bd, footer('Applied if and when lawful', 'Edit abilities', 'body'));\n    feed.appendChild(c);\n  }\n\n  /* ── Knowledge of you ── */\n  {\n    const c = cardShell('legacy', 'memory', 'Knowledge of You', 'Featured');\n    c.classList.add('feature');\n    const bd = el('div', 'card-bd');\n    const k = state.values.knowledge;\n    bd.appendChild(emphasise(el('p', 'pull'), k));\n    const tags = el('div', 'tags');\n    (k.tags || []).forEach(t => tags.appendChild(el('span','tag','')).textContent = t);\n    (k.altTags || []).forEach(t => tags.appendChild(el('span','tag alt','')).textContent = t);\n    bd.appendChild(tags);\n    c.append(bd, footer('', 'Edit', null));\n    feed.appendChild(c);\n  }\n\n  /* ── Legacy motivation ── */\n  {\n    const c = cardShell('legacy', 'legacy', 'Legacy Motivation', 'Why this matters');\n    const bd = el('div', 'card-bd');\n    bd.appendChild(emphasise(el('p', 'pull'), state.values.motivation));\n    c.append(bd, footer('', 'Edit', null));\n    feed.appendChild(c);\n  }\n\n  /* ── Consent ── */\n  {\n    const c = cardShell('legacy', 'consent', 'Genetic Contribution', 'Consent');\n    const bd = el('div', 'card-bd');\n    const p = el('p');\n    p.style.cssText = 'font-size:13.5px;color:var(--ink-2);line-height:1.55';\n    bd.appendChild(emphasise(p, state.values.consent, 'consent-strong'));\n    c.append(bd, footer('', 'Change consent', null));\n    feed.appendChild(c);\n  }\n\n  /* ── Notes (private, persisted) ── */\n  feed.appendChild(notesCard());\n\n  applyFilter();\n}\n\nfunction prettyAbility(k) {\n  return String(k).replace(/^c\\d+$/, 'Custom ability')\n    .replace(/([a-z])([A-Z])/g, '$1 $2')\n    .replace(/^./, c => c.toUpperCase());\n}\n\nfunction notesCard() {\n  const c = cardShell('legacy', 'note', 'Personal Notes', 'Private');\n  const bd = el('div', 'card-bd');\n  if (state.notes.length) {\n    const list = el('div', 'note-list');\n    state.notes.forEach((nt, i) => {\n      const w = el('div', 'note');\n      const p = el('p');\n      p.textContent = nt.text;\n      if (nt.at) {\n        const t = el('time');\n        t.textContent = new Date(nt.at).toLocaleDateString(undefined,\n          { day:'numeric', month:'short', year:'numeric' });\n        p.appendChild(t);\n      }\n      const del = el('button', null,\n        '\u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\">\u003cpath d=\"M18 6 6 18M6 6l12 12\"/>\u003c/svg>');\n      del.type = 'button';\n      del.setAttribute('aria-label', 'Delete note');\n      del.addEventListener('click', () => {\n        const removed = state.notes.splice(i, 1)[0];\n        saveProfile(); buildFeed();\n        /* Deleting a personal note deserves a way back */\n        toast('Note deleted', { label:'Undo', fn:() => {\n          state.notes.splice(Math.min(i, state.notes.length), 0, removed);\n          saveProfile(); buildFeed(); toast('Note restored');\n        }});\n      });\n      w.append(p, del);\n      list.appendChild(w);\n    });\n    bd.appendChild(list);\n  } else if (!state.noteFormOpen) {\n    bd.appendChild(el('p', 'empty-note', ''))\n      .textContent = 'No notes yet. Add a memory, a hope, or a message they’ll one day read.';\n  }\n\n  if (state.noteFormOpen) {\n    const f = el('div', 'note-form');\n    const ta = el('textarea');\n    ta.maxLength = 600;\n    ta.placeholder = 'Write something for them…';\n    const act = el('div', 'note-actions');\n    const cc = el('span', 'charc', '0 / 600');\n    const right = el('div');\n    right.style.cssText = 'display:flex;gap:8px';\n    const cancel = el('button', 'btn', 'Cancel'); cancel.type = 'button';\n    const add = el('button', 'btn go', 'Save note'); add.type = 'button'; add.disabled = true;\n    right.append(cancel, add);\n    act.append(cc, right);\n    f.append(ta, act);\n    bd.appendChild(f);\n    setTimeout(() => ta.focus(), 0);\n    ta.addEventListener('input', () => {\n      cc.textContent = `${ta.value.length} / 600`;\n      add.disabled = !ta.value.trim();\n    });\n    cancel.addEventListener('click', () => { state.noteFormOpen = false; buildFeed(); });\n    add.addEventListener('click', () => {\n      const v = ta.value.trim();\n      if (!v) return;\n      state.notes.unshift({ text:v.slice(0, 600), at:Date.now() });\n      state.noteFormOpen = false; saveProfile(); buildFeed(); toast('Note saved');\n    });\n  } else {\n    const b = el('button', 'add-note',\n      '\u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\">\u003cpath d=\"M12 5v14M5 12h14\"/>\u003c/svg> Add a note');\n    b.type = 'button';\n    b.addEventListener('click', () => { state.noteFormOpen = true; buildFeed(); });\n    bd.appendChild(b);\n  }\n  c.appendChild(bd);\n  return c;\n}\n\n/* ═══════════ 6 · FILTERS ═══════════\n   One feed, filtered in place. The source duplicated the same cards across\n   four tab panes, which is where most of its scroll length came from. */\nfunction renderFilters() {\n  const wrap = document.getElementById('filters');\n  wrap.textContent = '';\n  const counts = {};\n  document.querySelectorAll('#feed .card').forEach(c => {\n    counts[c.dataset.sec] = (counts[c.dataset.sec] || 0) + 1;\n  });\n  FILTERS.forEach(f => {\n    const total = f.id === 'all'\n      ? Object.values(counts).reduce((a, b) => a + b, 0) : (counts[f.id] || 0);\n    if (f.id !== 'all' && !total) return;\n    const b = el('button', 'fchip');\n    b.type = 'button';\n    b.setAttribute('role', 'tab');\n    b.setAttribute('aria-pressed', String(state.filter === f.id));\n    b.dataset.f = f.id;\n    b.appendChild(document.createTextNode(f.label));\n    const nEl = el('span', 'n'); nEl.textContent = total; b.appendChild(nEl);\n    b.addEventListener('click', () => {\n      state.filter = f.id;\n      renderFilters(); applyFilter();\n      document.querySelector('.filters-wrap')\n        .scrollIntoView({ behavior:'smooth', block:'start' });\n    });\n    wrap.appendChild(b);\n  });\n}\nfunction applyFilter() {\n  document.querySelectorAll('#feed .card').forEach(c => {\n    c.style.display = (state.filter === 'all' || c.dataset.sec === state.filter) ? '' : 'none';\n  });\n  renderFilters();\n}\n\n/* ═══════════ 7 · PAINT ═══════════ */\nfunction paint() {\n  document.getElementById('nameEl').textContent = NAME;\n  document.getElementById('hdrName').textContent = NAME;\n  document.getElementById('shareName').textContent = NAME;\n  document.title = `${NAME} — MySpawn Descendant Profile`;\n\n  document.getElementById('avatar').innerHTML = renderFace(state.face, 'av', '10 6 180 180');\n\n  const d = new Date(state.birth + 'T00:00:00');\n  document.getElementById('arrivalVal').textContent = isNaN(d) ? '—'\n    : d.toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });\n  document.getElementById('arrivalInput').value = state.birth;\n\n  const stats = document.getElementById('stats');\n  stats.textContent = '';\n  const h = fmtHeight(state.body.height);\n  const yearsOut = isNaN(d) ? null : Math.max(0, d.getFullYear() - new Date().getFullYear());\n  [\n    [String(traitTotal()), 'Traits'],\n    [h || '—', 'Height'],\n    [String(abilityCount()), 'Abilities'],\n    [yearsOut == null ? '—' : String(yearsOut), 'Years out']\n  ].forEach(([v, l]) => {\n    const s = el('div', 'stat');\n    s.appendChild(el('div', 'n', '')).textContent = v;\n    s.appendChild(el('div', 'l', '')).textContent = l;\n    stats.appendChild(s);\n  });\n\n  const cmp = completeness();\n  document.getElementById('cmpPct').textContent = cmp.pct + '%';\n  document.getElementById('cmpFill').style.width = cmp.pct + '%';\n  const gaps = document.getElementById('cmpGaps');\n  gaps.textContent = '';\n  if (!cmp.gaps.length) {\n    const done = el('div', 'cmp-done',\n      '\u003csvg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>');\n    done.appendChild(document.createTextNode('Everything is filled in.'));\n    gaps.appendChild(done);\n  } else {\n    cmp.gaps.forEach(g => {\n      const b = el('button', 'gap-chip');\n      b.type = 'button';\n      b.textContent = `${g.label} ${g.done}/${g.total}`;\n      b.addEventListener('click', () => {\n        if (g.room) goRoom(g.room);\n        else toast('That room is not built yet');\n      });\n      gaps.appendChild(b);\n    });\n  }\n\n  const id = 'MSP-' + (NAME.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3) || 'XXX') + '1XTD';\n  document.getElementById('publicId').textContent = id;\n  document.getElementById('kitId').textContent = 'KIT-2026-Y' + id.slice(4);\n  document.getElementById('shareUrl').textContent = 'myspawn.me/p/' + id;\n\n  const upd = new Date();\n  document.getElementById('createdAt').textContent = 'Feb 2026';\n  document.getElementById('updatedAt').textContent =\n    upd.toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' });\n\n  buildFeed();\n}\n\n/* ═══════════ 8 · FEEDBACK ═══════════ */\nlet toastTimer;\nfunction toast(msg, action) {\n  if (!msg) return;\n  const e = document.getElementById('toast');\n  e.textContent = msg;\n  if (action) {\n    const b = el('button', 'toast-act', '');\n    b.type = 'button';\n    b.textContent = action.label;\n    b.addEventListener('click', () => { e.classList.remove('on'); action.fn(); });\n    e.appendChild(b);\n  }\n  e.classList.add('on');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => e.classList.remove('on'), action ? 5200 : 1900);\n}\nconst buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} };\n\n/* ═══════════ 9 · WIRING ═══════════ */\ndocument.getElementById('arrivalInput').addEventListener('change', e => {\n  if (!e.target.value) return;\n  state.birth = e.target.value; saveProfile(); paint(); buzz(8); toast('Projected arrival updated');\n});\n\nasync function doShare() {\n  const url = 'https://' + document.getElementById('shareUrl').textContent;\n  const data = { title:`${NAME} — MySpawn`, text:`Meet ${NAME}, a conceptual blueprint.`, url };\n  if (navigator.share) {\n    try { await navigator.share(data); return; } catch (_) { /* dismissed */ }\n  }\n  copy(url);\n}\nfunction copy(text) {\n  const done = () => { toast('Link copied'); buzz(8); };\n  if (navigator.clipboard && navigator.clipboard.writeText) {\n    navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));\n  } else fallbackCopy(text, done);\n}\nfunction fallbackCopy(text, done) {\n  const ta = document.createElement('textarea');\n  ta.value = text; ta.setAttribute('readonly', '');\n  ta.style.cssText = 'position:fixed;opacity:0';\n  document.body.appendChild(ta); ta.select();\n  try { document.execCommand('copy'); done(); } catch (_) { toast('Copy failed'); }\n  ta.remove();\n}\ndocument.getElementById('shareBtn').addEventListener('click', doShare);\ndocument.getElementById('shareTop').addEventListener('click', doShare);\ndocument.getElementById('copyBtn').addEventListener('click', () =>\n  copy('https://' + document.getElementById('shareUrl').textContent));\ndocument.getElementById('editBtn').addEventListener('click', () => goRoom('face'));\n['pdfBtn', 'dockPdf'].forEach(id =>\n  document.getElementById(id).addEventListener('click', () => toast('Preparing PDF…')));\n['moreBtn', 'moreTop'].forEach(id =>\n  document.getElementById(id).addEventListener('click', () => toast('More options coming soon')));\ndocument.getElementById('deleteBtn').addEventListener('click', () => {\n  if (!confirm(`Delete ${NAME}'s profile? This clears the blueprint stored on this device.`)) return;\n  /* Snapshot everything so the confirm is not the last line of defence */\n  const backup = {};\n  [FACE_STORE, FACE_STORE_LEGACY, BODY_STORE, PROFILE_STORE].forEach(k => {\n    try { backup[k] = localStorage.getItem(k); } catch (_) {}\n  });\n  try { [FACE_STORE, FACE_STORE_LEGACY, BODY_STORE, PROFILE_STORE]\n    .forEach(k => localStorage.removeItem(k)); } catch (_) {}\n  state.face = {}; state.body = {}; state.notes = []; state.birth = '2050-06-14';\n  paint();\n  toast('Profile cleared', { label:'Undo', fn:() => {\n    try { Object.entries(backup).forEach(([k, v]) => { if (v != null) localStorage.setItem(k, v); }); } catch (_) {}\n    loadProfile(); paint(); toast('Profile restored');\n  }});\n});\n\nconst legal = document.getElementById('legal');\ndocument.getElementById('legalBtn').addEventListener('click', e => {\n  const open = !legal.classList.contains('open');\n  legal.classList.toggle('open', open);\n  e.currentTarget.setAttribute('aria-expanded', String(open));\n});\n\nconst hdr = document.getElementById('hdr');\nlet ticking = false;\naddEventListener('scroll', () => {\n  if (ticking) return;\n  ticking = true;\n  requestAnimationFrame(() => { hdr.classList.toggle('stuck', scrollY > 120); ticking = false; });\n}, { passive:true });\n\n/* ═══════════ 10 · BOOT ═══════════ */\nloadProfile();\npaint();\nif (!Object.keys(state.face).length && !Object.keys(state.body).length) {\n  /* Nothing designed yet — show a plausible descendant so the page reads. */\n  state.face = { race:'Mixed Race', shape:'Oval', jaw:'Defined', nose:'Medium', eye:'Hazel',\n                 skin:'Olive', haircolor:'Black', hairstyle:'Short', hairline:'Natural',\n                 expression:'Calm' };\n  state.body = { sex:'Male', build:'Muscular', height:69, abs:'Shredded',\n                 path:'enhanced', style:'specific',\n                 abilities:['immunity','memory','learning','endurance','regen'], custom:[] };\n  paint();\n  toast('Showing a sample blueprint');\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"
};
const TITLES = {
  face: 'MySpawn — Design Their Identity',
  body: 'MySpawn — Shape Their Body',
  profile: 'MySpawn — Descendant Profile'
};
const ORDER = ['face', 'body', 'profile'];
const frames = {};
ORDER.forEach(k => frames[k] = { el: document.getElementById('step-' + k), loaded: false });

// forward this file's own query (?name=&sex=&photo=) into every room
const SEARCH = location.search || '';

function mount(key) {
  const f = frames[key];
  // the profile re-renders from localStorage, so rebuild it on every visit
  if (f.loaded && key !== 'profile') return;
  const doc = f.el.contentDocument;
  doc.open();
  doc.write('<script>window.__fbdSearch=' + JSON.stringify(SEARCH) + '<\/script>' + PAGES[key]);
  doc.close();
  f.loaded = true;
}

let current = null;
function show(key) {
  if (current === key) return;
  mount(key);
  ORDER.forEach(k => frames[k].el.classList.toggle('on', k === key));
  document.title = TITLES[key];
  current = key;
  if (history.state?.fbd !== key) history.pushState({ fbd: key }, '', '#' + key);
}

addEventListener('message', e => {
  const m = e.data;
  if (!m || !m.fbd) return;
  if (m.fbd === 'next') {
    const i = ORDER.indexOf(m.from);
    if (i > -1 && i < ORDER.length - 1) show(ORDER[i + 1]);
  } else if (m.fbd === 'back') {
    const i = ORDER.indexOf(m.from);
    if (i > 0) show(ORDER[i - 1]);
  } else if (m.fbd === 'goto' && ORDER.includes(m.target)) {
    show(m.target);
  }
});

// browser back/forward moves between rooms
addEventListener('popstate', e => {
  const key = e.state?.fbd || (location.hash || '#face').slice(1);
  if (ORDER.includes(key) && key !== current) {
    mount(key);
    ORDER.forEach(k => frames[k].el.classList.toggle('on', k === key));
    document.title = TITLES[key];
    current = key;
  }
});

const start = (location.hash || '#face').slice(1);
show(ORDER.includes(start) ? start : 'face');
</script>
</body>
</html>
