eyframes sheen{ 0%,100%{ background-position:0% 50%;} 50%{ background-position:100% 50%;} }\n.cta.blocked{ background:var(--surface-2); color:var(--ink-4); box-shadow:none; cursor:not-allowed; }\n\n.toast{ position:fixed; left:50%; bottom:calc(96px + var(--sab)); transform:translate(-50%,14px);\n  z-index:80; background:var(--ink); color:var(--bg); font-size:13px; font-weight:600;\n  padding:10px 18px; border-radius:var(--r-full); box-shadow:var(--sh-3);\n  opacity:0; pointer-events:none; transition:all var(--base) var(--ease); white-space:nowrap;\n  display:flex; align-items:center; gap:12px; }\n.toast.on{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }\n.toast-act{ font-family:inherit; font-size:12.5px; font-weight:800; letter-spacing:.02em;\n  color:#5B54E8; background:none; border:none; cursor:pointer; padding:2px 0;\n  text-transform:uppercase; }\n.toast-act:hover{ text-decoration:underline; text-underline-offset:3px; }\n\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important;\n    transition-duration:.01ms !important; }\n  html{ scroll-behavior:auto; }\n}\n@media (max-width:360px){\n  :root{ --pad:16px; }\n  .figs{ grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"ambient\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\n\u003csvg width=\"0\" height=\"0\" aria-hidden=\"true\" style=\"position:absolute\">\u003cdefs>\n  \u003clinearGradient id=\"rg\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n    \u003cstop offset=\"0%\" stop-color=\"#5B54E8\"/>\u003cstop offset=\"55%\" stop-color=\"#8B5CF6\"/>\n    \u003cstop offset=\"100%\" stop-color=\"#EC4899\"/>\n  \u003c/linearGradient>\n\u003c/defs>\u003c/svg>\n\n\u003cheader class=\"hdr\" id=\"hdr\">\n  \u003cdiv class=\"hdr-in\">\n    \u003cbutton class=\"icon-btn\" id=\"back\" aria-label=\"Back to face\">\n      \u003csvg width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M19 12H5\"/>\u003cpath d=\"m12 19-7-7 7-7\"/>\u003c/svg>\n    \u003c/button>\n    \u003cdiv class=\"hdr-mid\">\n      \u003cspan class=\"hdr-kicker\">\u003cspan class=\"pulse\">\u003c/span>Room 2 · Body &amp; Abilities\u003c/span>\n      \u003cspan class=\"hdr-title\" id=\"hdrTitle\">Shape the frame\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"ring\" role=\"progressbar\" aria-valuemin=\"0\" aria-valuemax=\"4\" aria-valuenow=\"0\"\n         aria-label=\"Body setup progress\" id=\"ring\">\n      \u003csvg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\">\n        \u003ccircle class=\"trk\" cx=\"22\" cy=\"22\" r=\"19.5\" fill=\"none\" stroke-width=\"2.6\"/>\n        \u003ccircle class=\"val\" id=\"ringVal\" cx=\"22\" cy=\"22\" r=\"19.5\" fill=\"none\" stroke-width=\"2.6\"\n                stroke-dasharray=\"122.52\" stroke-dashoffset=\"122.52\"/>\n      \u003c/svg>\n      \u003cdiv class=\"mini\">\u003cdiv class=\"figure\" id=\"figMini\">\u003c/div>\u003c/div>\n    \u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain class=\"shell\">\n\n  \u003csection class=\"hero\">\n    \u003cdiv class=\"stage\">\n      \u003cdiv class=\"figure\" id=\"figHero\" role=\"img\" aria-label=\"Live preview of the body\">\u003c/div>\n      \u003cdiv class=\"tick\" aria-hidden=\"true\">\u003cb id=\"tickLbl\">FROM PHOTO\u003c/b>\u003c/div>\n    \u003c/div>\n    \u003cp class=\"hero-cap\" id=\"heroCap\">Live preview — updates as you choose\u003c/p>\n    \u003ch1>Shape \u003cspan class=\"nm\" id=\"heroName\">Ray\u003c/span>'s body.\u003c/h1>\n    \u003cp class=\"lede\">Set the physique, then decide how far their abilities go. Anything you skip is \u003cb>inherited from your photo\u003c/b>.\u003c/p>\n    \u003cbutton class=\"ghost-btn\" id=\"skipFrame\">\n      \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"m13 17 5-5-5-5\"/>\u003cpath d=\"m6 17 5-5-5-5\"/>\u003c/svg>\n      Keep the physique from my photo\n    \u003c/button>\n  \u003c/section>\n\n  \u003cdiv class=\"sections\" id=\"sections\">\u003c/div>\n\n  \u003csection class=\"summary\" id=\"summary\">\n    \u003cdiv class=\"sm-hd\">\n      \u003cspan class=\"sm-kick\">The Body Blueprint\u003c/span>\n      \u003cspan class=\"sm-stat\" id=\"smStat\">DRAFT\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"sm-fig\">\u003cdiv class=\"figure\" id=\"figBig\" role=\"img\" aria-label=\"Your body blueprint\">\u003c/div>\u003c/div>\n    \u003cdiv class=\"sm-name\" id=\"smName\">Ray\u003c/div>\n    \u003cdiv class=\"sm-list\" id=\"smList\">\u003c/div>\n    \u003cdiv class=\"sm-abil\" id=\"smAbil\" hidden>\n      \u003cdiv class=\"h\" id=\"smAbilH\">Abilities\u003c/div>\n      \u003cdiv class=\"sm-chips\" id=\"smChips\">\u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"legal\" id=\"legal\">\n    \u003cbutton class=\"legal-hd\" aria-expanded=\"false\" aria-controls=\"legalBd\" id=\"legalBtn\">\n      \u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 16v-4\"/>\u003cpath d=\"M12 8h.01\"/>\u003c/svg>\n      Conceptual preferences — not promises or prescriptions\n      \u003csvg class=\"chev\" width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"m6 9 6 6 6-6\"/>\u003c/svg>\n    \u003c/button>\n    \u003cdiv class=\"legal-bd\" id=\"legalBd\">\u003cdiv>\n      \u003cp>Body and ability selections are \u003cstrong>conceptual preferences\u003c/strong> recorded in your\n      legacy profile — not promises, prescriptions, or biological instructions. MySpawn performs\n      no genetic, reproductive, medical, or enhancement procedures. Anatomy adjustments are stored\n      as relative preferences above a natural baseline, never as absolute values. Nothing here is\n      binding or final. \u003ca href=\"#\">Read full terms →\u003c/a>\u003c/p>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"foot\">\n    \u003ca href=\"#\">Privacy\u003c/a>·\u003ca href=\"#\">Terms\u003c/a>·\u003ca href=\"#\">FAQ\u003c/a>\u003cbr>\n    © 2026 MySpawn Inc.\n  \u003c/div>\n\u003c/main>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\n\u003cdiv class=\"dock\">\n  \u003cdiv class=\"dock-in\">\n    \u003cbutton class=\"cta\" id=\"cta\">\n      \u003cspan id=\"ctaTxt\">Continue to questions\u003c/span>\n      \u003csvg id=\"ctaArrow\" width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14\"/>\u003cpath d=\"m12 5 7 7-7 7\"/>\u003c/svg>\n    \u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n'use strict';\n\n/* ═══════ 1 · BODY ENGINE ═══════ */\nconst n = v => Math.round(v * 10) / 10;\n\nconst BUILD_M = {\n  'Lean':     { sh:38, ch:32, wa:23, hi:30, arm:6.5,  thigh:14, calf:9.0,  neck:9  },\n  'Athletic': { sh:47, ch:39, wa:27, hi:34, arm:8.5,  thigh:18, calf:11.0, neck:11 },\n  'Muscular': { sh:56, ch:47, wa:33, hi:39, arm:11.5, thigh:23, calf:13.5, neck:14 },\n  'Average':  { sh:42, ch:37, wa:34, hi:38, arm:8.0,  thigh:19, calf:11.0, neck:10.5 },\n  'Stocky':   { sh:49, ch:46, wa:44, hi:46, arm:10.5, thigh:23, calf:13.0, neck:13 }\n};\n/* Female plan: shoulders narrower than or level with the hips, waist pulled in,\n   limbs slighter. Same option names so the trait reads identically either way. */\nconst BUILD_F = {\n  'Lean':     { sh:33, ch:30, wa:19, hi:34, arm:5.4, thigh:14, calf:8.4,  neck:8   },\n  'Athletic': { sh:40, ch:35, wa:22, hi:40, arm:6.9, thigh:17, calf:10.0, neck:9.4 },\n  'Muscular': { sh:47, ch:41, wa:27, hi:45, arm:9.0, thigh:21, calf:12.0, neck:11  },\n  'Average':  { sh:36, ch:34, wa:28, hi:43, arm:6.6, thigh:18, calf:10.0, neck:9   },\n  'Stocky':   { sh:43, ch:42, wa:38, hi:49, arm:8.6, thigh:21, calf:12.0, neck:10.6 }\n};\nconst BUILD = BUILD_M;                              // option keys are shared\nconst DEFAULT_M = { sh:43, ch:37, wa:29, hi:34, arm:8,   thigh:17.5, calf:10.5, neck:10.5 };\nconst DEFAULT_F = { sh:37, ch:34, wa:24, hi:40, arm:6.7, thigh:17,   calf:10,   neck:9.2 };\nconst tableFor = sex => sex === 'Female' ? BUILD_F : BUILD_M;\nconst defaultFor = sex => sex === 'Female' ? DEFAULT_F : DEFAULT_M;\n\n/* A muscular frame should read as muscular even before Abs is answered. */\nconst IMPLIED_ABS = { Lean:'Light', Athletic:'Toned', Muscular:'Hard', Average:null, Stocky:null };\nconst ABS = {\n  'Soft':     { rows:0, op:0,   obliq:0   },\n  'Light':    { rows:2, op:.15, obliq:0   },\n  'Toned':    { rows:3, op:.25, obliq:.13 },\n  'Hard':     { rows:3, op:.36, obliq:.22 },\n  'Shredded': { rows:4, op:.50, obliq:.34 }\n};\nconst Y = { headCy:44, sh:88, ch:118, wa:170, hi:198, crotch:213, knee:302, ankle:378, sole:392 };\nconst MID = (Y.headCy + Y.sole) / 2;\n\n\n/* Tapered limb through centre points, domed at both ends. Closing with a\n   straight edge left a flat tab poking out of each shoulder. */\nfunction limb(pts) {\n  const L = pts.map(p => ({ x:p.x - p.w, y:p.y }));\n  const R = pts.map(p => ({ x:p.x + p.w, y:p.y }));\n  const end = pts[pts.length - 1];\n  let d = `M${n(L[0].x)} ${n(L[0].y)}`;\n  for (let i = 1; i \u003c L.length; i++) {\n    const a = L[i-1], b = L[i], m = (a.y + b.y) / 2;\n    d += `C${n(a.x)} ${n(m)} ${n(b.x)} ${n(m)} ${n(b.x)} ${n(b.y)}`;\n  }\n  d += `A${n(end.w)} ${n(end.w)} 0 0 0 ${n(R[R.length-1].x)} ${n(R[R.length-1].y)}`;\n  for (let i = R.length - 2; i >= 0; i--) {\n    const a = R[i+1], b = R[i], m = (a.y + b.y) / 2;\n    d += `C${n(a.x)} ${n(m)} ${n(b.x)} ${n(m)} ${n(b.x)} ${n(b.y)}`;\n  }\n  return d + `A${n(pts[0].w)} ${n(pts[0].w)} 0 0 0 ${n(L[0].x)} ${n(L[0].y)}Z`;\n}\n\nfunction torsoPath(b) {\n  const { sh, ch, wa, hi } = b;\n  return `M${n(100-sh*.28)} ${n(Y.sh-13)}`\n       + `C${n(100-sh*.62)} ${n(Y.sh-11)} ${n(100-sh)} ${n(Y.sh-6)} ${n(100-sh)} ${n(Y.sh+7)}`\n       + `C${n(100-sh)} ${n(Y.sh+18)} ${n(100-ch)} ${n(Y.ch-16)} ${n(100-ch)} ${Y.ch}`\n       + `C${n(100-ch)} ${n(Y.ch+24)} ${n(100-wa)} ${n(Y.wa-22)} ${n(100-wa)} ${Y.wa}`\n       + `C${n(100-wa)} ${n(Y.wa+13)} ${n(100-hi)} ${n(Y.hi-12)} ${n(100-hi)} ${Y.hi}`\n       + `C${n(100-hi)} ${n(Y.hi+13)} ${n(100-hi*.52)} ${n(Y.crotch)} 100 ${n(Y.crotch)}`\n       + `C${n(100+hi*.52)} ${n(Y.crotch)} ${n(100+hi)} ${n(Y.hi+13)} ${n(100+hi)} ${Y.hi}`\n       + `C${n(100+hi)} ${n(Y.hi-12)} ${n(100+wa)} ${n(Y.wa+13)} ${n(100+wa)} ${Y.wa}`\n       + `C${n(100+wa)} ${n(Y.wa-22)} ${n(100+ch)} ${n(Y.ch+24)} ${n(100+ch)} ${Y.ch}`\n       + `C${n(100+ch)} ${n(Y.ch-16)} ${n(100+sh)} ${n(Y.sh+18)} ${n(100+sh)} ${n(Y.sh+7)}`\n       + `C${n(100+sh)} ${n(Y.sh-6)} ${n(100+sh*.62)} ${n(Y.sh-11)} ${n(100+sh*.28)} ${n(Y.sh-13)}`\n       + `Q100 ${n(Y.sh-16)} ${n(100-sh*.28)} ${n(Y.sh-13)}Z`;\n}\nconst armPath = (b, sx) => limb([\n  { x:100 + sx*(b.sh - b.arm*0.42), y:Y.sh + 4,        w:b.arm },\n  { x:100 + sx*(b.sh + b.arm*0.55), y:Y.ch + 26,       w:b.arm*0.86 },\n  { x:100 + sx*(b.sh + b.arm*0.95), y:Y.wa + 12,       w:b.arm*0.66 },\n  { x:100 + sx*(b.sh + b.arm*1.15), y:Y.crotch + 16,   w:b.arm*0.58 }\n]);\n/* Torso and both legs as ONE continuous silhouette. Drawing them as separate\n   shapes always leaves a seam: legs behind, the torso's bottom edge closes into\n   a briefs shape; legs in front, their end caps read as arcs across the hips. */\nfunction bodyPath(b) {\n  const { sh, ch, wa, hi, thigh, calf } = b;\n  const kC = hi * 0.54, kW = calf * 1.12;      // knee centre / half-width\n  const aC = hi * 0.52, aW = calf * 0.56;      // ankle\n  const tOut = hi * 0.54 + thigh * 0.72;       // upper-thigh outer bulge\n  const tIn  = Math.max(gapAt(hi) + 2, hi * 0.54 - thigh * 0.72);\n  const g = gapAt(hi);\n  const L = [];\n  const legDown = sx =>\n      `C${n(100+sx*(hi+1))} ${n(Y.hi+24)} ${n(100+sx*tOut)} ${n(Y.knee-62)} ${n(100+sx*(kC+kW))} ${n(Y.knee)}`\n    + `C${n(100+sx*(kC+kW))} ${n(Y.knee+36)} ${n(100+sx*(aC+aW))} ${n(Y.ankle-42)} ${n(100+sx*(aC+aW))} ${n(Y.ankle)}`;\n  const legUp = sx =>\n      `C${n(100+sx*(aC-aW))} ${n(Y.ankle-42)} ${n(100+sx*(kC-kW))} ${n(Y.knee+36)} ${n(100+sx*(kC-kW))} ${n(Y.knee)}`\n    + `C${n(100+sx*tIn)} ${n(Y.knee-62)} ${n(100+sx*g)} ${n(Y.crotch+26)} ${n(100+sx*g)} ${n(Y.crotch)}`;\n  // both feet trace smaller-x -> larger-x, so both arcs sweep the same way\n  const foot = sx => `A${n(aW)} ${n(aW)} 0 0 0 ${n(100 + sx*aC + aW)} ${n(Y.ankle)}`;\n\n  L.push(`M${n(100-sh*.28)} ${n(Y.sh-13)}`);\n  L.push(`C${n(100-sh*.62)} ${n(Y.sh-11)} ${n(100-sh)} ${n(Y.sh-6)} ${n(100-sh)} ${n(Y.sh+7)}`);\n  L.push(`C${n(100-sh)} ${n(Y.sh+18)} ${n(100-ch)} ${n(Y.ch-16)} ${n(100-ch)} ${Y.ch}`);\n  L.push(`C${n(100-ch)} ${n(Y.ch+24)} ${n(100-wa)} ${n(Y.wa-22)} ${n(100-wa)} ${Y.wa}`);\n  L.push(`C${n(100-wa)} ${n(Y.wa+13)} ${n(100-hi)} ${n(Y.hi-12)} ${n(100-hi)} ${Y.hi}`);\n  L.push(legDown(-1), foot(-1), legUp(-1));\n  L.push(`Q100 ${n(Y.crotch-9)} ${n(100+g)} ${n(Y.crotch)}`);   // crotch apex\n  L.push(mirrorDown(1, kC, kW, aC, aW, tIn, g));\n  L.push(foot(1));\n  L.push(mirrorUp(1, hi, tOut, kC, kW, aC, aW));\n  L.push(`C${n(100+hi)} ${n(Y.hi-12)} ${n(100+wa)} ${n(Y.wa+13)} ${n(100+wa)} ${Y.wa}`);\n  L.push(`C${n(100+wa)} ${n(Y.wa-22)} ${n(100+ch)} ${n(Y.ch+24)} ${n(100+ch)} ${Y.ch}`);\n  L.push(`C${n(100+ch)} ${n(Y.ch-16)} ${n(100+sh)} ${n(Y.sh+18)} ${n(100+sh)} ${n(Y.sh+7)}`);\n  L.push(`C${n(100+sh)} ${n(Y.sh-6)} ${n(100+sh*.62)} ${n(Y.sh-11)} ${n(100+sh*.28)} ${n(Y.sh-13)}`);\n  L.push(`Q100 ${n(Y.sh-16)} ${n(100-s t' });\n  }, SETTLE + 60);\n}\n\n/* ═══════ 8 · LOADOUT ═══════ */\nfunction renderTabs() {\n  const wrap = document.getElementById('tabs');\n  wrap.textContent = '';\n  CATS.forEach(c => {\n    const b = el('button', 'tab');\n    b.type = 'button'; b.setAttribute('role', 'tab');\n    b.setAttribute('aria-selected', String(state.cat === c.id && !state.query));\n    b.dataset.cat = c.id;\n    const count = c.id === 'custom' ? state.custom.length\n      : abilitiesFor(c.id).filter(a => state.abilities.has(a.key)).length;\n    b.innerHTML = I(ICO[c.ico]);\n    b.appendChild(document.createTextNode(c.name));\n    if (count) { const s = el('span', 'n'); s.textContent = count; b.appendChild(s); }\n    b.addEventListener('click', () => {\n      state.cat = c.id; state.query = '';\n      const inp = document.getElementById('abSearch'); if (inp) inp.value = '';\n      renderTabs(); renderAbilities();\n    });\n    wrap.appendChild(b);\n  });\n}\n\nfunction abilityCard(a, showCat) {\n  const b = el('button', 'ability');\n  b.type = 'button';\n  b.setAttribute('role', 'checkbox');\n  const on = state.abilities.has(a.key);\n  b.setAttribute('aria-checked', String(on));\n  const full = state.abilities.size >= MAX_ABILITIES && !on;\n  if (full) { b.classList.add('locked'); b.setAttribute('aria-disabled', 'true'); }\n  const ico = ICO[a.key] || ICO.custom;\n  b.innerHTML = `\u003cspan class=\"ab-ico\">${I(ico)}\u003c/span>\n    \u003cspan class=\"ab-body\">${showCat ? '\u003cspan class=\"ab-cat\">\u003c/span>' : ''}\n      \u003cspan class=\"ab-nm\">\u003c/span>\u003cspan class=\"ab-desc\">\u003c/span>\u003c/span>\n    \u003cspan class=\"ab-mark\">${CHECK}\u003c/span>`;\n  if (showCat) {\n    const c = CAT_OF[a.key];\n    b.querySelector('.ab-cat').textContent = c ? (CATS.find(x => x.id === c) || {}).name : 'Your own';\n  }\n  b.querySelector('.ab-nm').textContent = a.name;\n  b.querySelector('.ab-desc').textContent = a.desc || '';\n  b.addEventListener('click', () => {\n    if (s tContent =\n    state.height != null ? fmtHeight(state.height).toUpperCase() : 'FROM PHOTO';\n\n  document.getElementById('hdrTitle').textContent =\n    !state.build && state.height == null && !state.abs ? 'Shape the frame'\n    : !pathSettled ? `Frame set · choose a path`\n    : isEnhancedSpecific() ? `${state.abilities.size} of ${MAX_ABILITIES} equipped`\n    : state.path === 'natural' ? 'Natural path' : 'Era-standard path';\n\n  renderSummary();\n  paintCTA();\n}\n\nfunction renderSummary() {\n  const list = document.getElementById('smList');\n  list.textContent = '';\n  const rows = [];\n  if (state.sex)   // handed off from the previous step — shown, not editable here\n    rows.push(['Body Plan', state.sex + ' · set earlier', 'fixed-sex']);\n  rows.push(\n    ['Body Type', state.build, 'build'],\n    ['Height', state.height != null ? fmtHeight(state.height) : null, 'height'],\n    ['Abs Definition', state.abs, 'abs']\n  );\n  if (state.sex !== 'Female')   // anatomy only applies to the male body plan\n    rows.push(['Anatomy', state.anatomy > 0 ? fmtAnatomy(state.anatomy) : null, 'anatomy']);\n  rows.push(\n    ['Ability Path', state.path === 'natural' ? 'Natural human'\n      : state.path === 'enhanced'\n        ? (state.style === 'open' ? 'Enhanced · era standard'\n          : state.style === 'specific' ? 'Enhanced · hand-picked' : 'Enhanced · choose how')\n        : null, 'path']\n  );\n  rows.forEach(([k, v, jump]) => {\n    const b = el('button', 'sm-item' + (v ? '' : ' def'));\n    b.type = 'button';\n    const kk = el('span', 'k'); kk.textContent = k;\n    const vv = el('span', 'v'); vv.textContent = v || (jump === 'path' ? 'Not chosen' : 'From photo');\n    b.append(kk, vv);\n    b.setAttribute('aria-label', `${k}: ${vv.textContent}. Edit.`);\n    b.addEventListener('click', () => {\n      if (jump === 'fixed-sex') { toast('Body plan was set before this step'); return; }\n      if (jump === 'path') document.getElementById('sect-path')\n        .scrollIntoView({ behavior:REDUCED ? 'auto' : 'smooth', block:'start' });\n      else toggleRow(jump, true);\n    });\n    list.appendChild(b);\n  });\n\n  const abil = document.getElementById('smAbil');\n  const chips = document.getElementById('smChips');\n  const show = isEnhancedSpecific() && state.abilities.size > 0;\n  abil.hidden = !show;\n  if (show) {\n    document.getElementById('smAbilH').textContent = `Abilities · ${state.abilities.size}/${MAX_ABILITIES}`;\n    chips.textContent = '';\n    [...state.abilities].forEach(k => {\n      const a = lookup(k); if (!a) return;\n      const c = el('span', 'sm-chip'); c.textContent = a.name; chips.appendChild(c);\n    });\n  }\n  document.getElementById('smStat').textContent =\n    requiredDone() === requiredTotal() ? 'READY' : 'DRAFT';\n}\n\nfunction paintCTA() {\n  const cta = document.getElementById('cta');\n  const txt = document.getElementById('ctaTxt');\n  const arrow = document.getElementById('ctaArrow');\n  const settled = state.path === 'natural' || (state.path === 'enhanced' && state.style);\n  cta.classList.toggle('blocked', !settled);\n  cta.classList.toggle('ready', !!settled);\n  cta.disabled = !settled;\n  arrow.style.display = settled ? '' : 'none';\n  txt.textContent = !state.path ? 'Choose an ability path to continue'\n    : state.path === 'enhanced' && !state.style ? 'Pick how specific to get'\n    : isEnhancedSpecific() && state.abilities.size\n      ? `Continue — ${state.abilities.size} ${state.abilities.size === 1 ? 'ability' : 'abilities'} equipped`\n      : 'Continue to questions';\n}\n\n/* ═══════ 10 · FEEDBACK ═══════ */\nlet toastTimer;\nfunction toast(msg, action) {\n  if (!msg) return;\n  const e = document.getElementById('toast');\n  e.textContent = msg;\n  if (action) {\n    const b = el('button', 'toast-act');\n    b.type = 'button';\n    b.textContent = action.label;\n    b.addEventListener('click', () => { e.classList.remove('on'); action.fn(); });\n    e.appendChild(b);\n  }\n  e.classList.add('on');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => e.classList.remove('on'), action ? 5200 : 1900);\n}\nconst buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} };\n\n/* ═══════ 11 · WIRING ═══════ */\nfunction fillTrack(input) {\n  const pct = (input.value - input.min) / (input.max - input.min) * 100;\n  input.style.setProperty('--fill', pct + '%');\n}\n\n/* Height */\n(function () {\n  const s = document.getElementById('heightSlider');\n  const val = document.getElementById('heightVal');\n  const set = (v, commit) => {\n    state.height = v;\n    val.textContent = fmtHeight(v); val.classList.remove('off');\n    s.setAttribute('aria-valuetext', fmtHeight(v));\n    fillTrack(s);\n    if (commit) { save(); paintFrameRow('height'); paintAll(true); refreshFigureOptions(); }\n  };\n  s.addEventListener('input', () => set(+s.value, false));\n  s.addEventListener('change', () => set(+s.value, true));\n  s.addEventListener('input', () => { paintFigures(false); document.getElementById('tickLbl').textContent = fmtHeight(+s.value).toUpperCase(); });\n  const unit = u => {\n    state.units.height = u;\n    document.getElementById('uFt').setAttribute('aria-pressed', String(u === 'ft'));\n    document.getElementById('uCm').setAttribute('aria-pressed', String(u === 'cm'));\n    document.getElementById('hMin').textContent = u === 'cm' ? '150 cm' : \"4'11\\\"\";\n    document.getElementById('hMax').textContent = u === 'cm' ? '211 cm' : \"6'11\\\"\";\n    if (state.height != null) { val.textContent = fmtHeight(state.height); paintFrameRow('height'); paintAll(); }\n  };\n  document.getElementById('uFt').addEventListener('click', () => unit('ft'));\n  document.getElementById('uCm').addEventListener('click', () => unit('cm'));\n  document.getElementById('hClear').addEventListener('click', () => {\n    state.height = null; s.value = 69; fillTrack(s);\n    val.textContent = 'Same as photo'; val.classList.add('off');\n    s.setAttribute('aria-valuetext', 'Same as photo');\n    save(); paintFrameRow('height'); paintAll(true); refreshFigureOptions();\n  });\n  fillTrack(s);\n})();\n\n/* Anatomy */\n(function () {\n  const s = document.getElementById('anaSlider');\n  const val = document.getElementById('anaVal');\n  const paint = () => {\n    val.textContent = fmtAnatomy(state.anatomy);\n    val.classList.toggle('off', state.anatomy === 0);\n    s.setAttribute('aria-valuetext', fmtAnatomy(state.anatomy));\n    fillTrack(s);\n  };\n  s.addEventListener('input', () => { state.anatomy = +s.value; paint(); });\n  s.addEventListener('change', () => { save(); paintAll(); });\n  const unit = u => {\n    state.units.anatomy = u;\n    document.getElementById('aIn').setAttribute('aria-pressed', String(u === 'in'));\n    document.getElementById('aCm').setAttribute('aria-pressed', String(u === 'cm'));\n    document.getElementById('aMax').textContent = u === 'cm' ? '+25.4 cm' : '+10 inches';\n    paint(); paintAll();\n  };\n  document.getElementById('aIn').addEventListener('click', () => unit('in'));\n  document.getElementById('aCm').addEventListener('click', () => unit('cm'));\n  document.getElementById('aClear').addEventListener('click', () => {\n    state.anatomy = 0; s.value = 0; paint(); save(); paintAll();\n  });\n  paint();\n})();\n\ndocument.getElementById('abSearch').addEventListener('input', e => {\n  state.query = e.target.value;\n  renderTabs(); renderAbilities();\n});\ndocument.getElementById('notes').addEventListener('input', e => {\n  state.notes = e.target.value; save();\n});\n\n/* Restores height slider + label to whatever state.height currently is */\nfunction syncHeightUI() {\n  const s = document.getElementById('heightSlider');\n  const v = document.getElementById('heightVal');\n  if (state.height != null) {\n    s.value = state.height;\n    v.textContent = fmtHeight(state.height); v.classList.remove('off');\n    s.setAttribute('aria-valuetext', fmtHeight(state.height));\n  } else {\n    s.value addEventListener('click', e => {\n  const open = !legal.classList.contains('open');\n  legal.classList.toggle('open', open);\n  e.currentTarget.setAttribute('aria-expanded', String(open));\n});\n\nconst hdr = document.getElementById('hdr');\nlet ticking = false;\naddEventListener('scroll', () => {\n  if (ticking) return;\n  ticking = true;\n  requestAnimationFrame(() => { hdr.classList.toggle('stuck', scrollY > 6); ticking = false; });\n}, { passive:true });\n\naddEventListener('keydown', e => {\n  if (e.key === 'Escape' && state.openRow) { toggleRow(state.openRow, false); return; }\n  if (!['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)) return;\n  const group = e.target.closest && e.target.closest('[role=\"radiogroup\"]');\n  if (!group) return;\n  e.preventDefault();\n  const items = [...group.querySelectorAll('[role=\"radio\"]')];\n  const i = items.indexOf(e.target);\n  const step = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1;\n  const next = items[(i + step + items.length) % items.length];\n  items.forEach(b => b.tabIndex = -1);   // tab stop follows focus\n  next.tabIndex = 0;\n  next.focus();\n  const label = group.getAttribute('aria-label');\n  const trait = FRAME.find(t => t.label === label);\n  if (trait) choose(trait.id, next.dataset.value || null, false);\n});\n\n/* ═══════ 12 · BOOT ═══════ */\nconst restored = restore();\nconst urlSex = sexFromURL();\nif (urlSex) state.sex = urlSex;   // the earlier step's decision always wins\nif (state.height != null) {\n  const s = document.getElementById('heightSlider');\n  s.value = state.height; fillTrack(s);\n  const v = document.getElementById('heightVal');\n  v.textContent = fmtHeight(state.height); v.classList.remove('off');\n}\nif (state.anatomy > 0) {\n  const s = document.getElementById('anaSlider');\n  s.value = state.anatomy; fillTrack(s);\n  const v = document.getElementById('anaVal');\n  v.textContent = fmtAnatomy(state.anatomy); v.classList.remove('off');\n}\ndocument.getElementById('notes').value = state.notes;\n['build','height','abs'].forEach(paintFrameRow);\nrenderTabs(); renderAbilities(); paintAll(); refreshFigureOptions();\nconst firstOpen = ['build','height','abs'].find(k => state[k] == null);\nif (firstOpen) toggleRow(firstOpen, true, /* silent */ true);\nif (restored) {\n  document.getElementById('heroCap').textContent = 'Restored from your last session';\n  toast('Picked up where you left off');\n} else if (state.sex) {\n  document.getElementById('heroCap').textContent =\n    `Live preview · ${state.sex} body plan, set earlier`;\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n",
  profile: "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\" />\n\u003cmeta name=\"theme-color\" content=\"#0B0D14\" />\n\u003cmeta name=\"color-scheme\" content=\"dark\" />\n\u003ctitle>MySpawn — Descendant Profile\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n/* ═══════════════════════════════════════════════════════════\n   MySpawn — Descendant Profile 1.11\n   Shares the token system with the Identity and Body designers.\n   ═══════════════════════════════════════════════════════════ */\n*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }\n\n:root{\n  --ink:#F3F4FB; --ink-2:#C7CBDE; --ink-3:#959CBA; --ink-4:#6B7396;\n  --bg:#0B0D14; --surface:rgba(24,28,42,.72); --surface-2:#1A1D2B; --surface-3:#222738;\n  --line:#262B3D; --line-2:#1E2231;\n  --brand:#8B84FF; --brand-2:#A78BFA; --brand-3:#F472B6;\n  --brand-tint:rgba(139,132,255,.10); --brand-tint-2:rgba(139,132,255,.22);\n  --good:#34D399; --warn:#FBBF24;\n  --fig-bg:#161A27; --fig-ink:#AEB6D4;\n  --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:999px;\n  --sh-1:0 1px 2px rgba(0,0,0,.34);\n  --sh-2:0 2px 8px -2px rgba(0,0,0,.42), 0 8px 24px -12px rgba(0,0,0,.5);\n  --sh-3:0 8px 32px -12px rgba(0,0,0,.6);\n  --sh-brand:0 8px 28px -10px rgba(139,132,255,.5);\n  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.4,.5,1);\n  --fast:.16s; --base:.28s; --slow:.44s;\n  --pad:20px; --max:580px; --header-h:56px; --sab:env(safe-area-inset-bottom, 0px);\n}\n\nhtml{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }\nbody{\n  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;\n  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;\n  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;\n  overscroll-behavior-y:none; overflow-x:hidden; min-height:100dvh;\n  padding-bottom:calc(112px + var(--sab));\n}\n.ambient{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }\n.ambient i{ position:absolute; border-radius:50%; display:block; }\n.ambient i:nth-child(1){ top:-200px; left:-140px; width:460px; height:460px;\n  background:radial-gradient(circle,rgba(139,92,246,.20),transparent 68%); }\n.ambient i:nth-child(2){ top:240px; right:-200px; width:480px; height:480px;\n  background:radial-gradient(circle,rgba(91,84,232,.15),transparent 68%); }\n.ambient i:nth-child(3){ bottom:-160px; left:-90px; width:380px; height:380px;\n  background:radial-gradient(circle,rgba(236,72,153,.10),transparent 68%); }\n.shell{ position:relative; z-index:1; max-width:var(--max); margin:0 auto; padding:0 var(--pad); }\n.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }\n:focus-visible{ outline:2.5px solid var(--brand); outline-offset:3px; border-radius:6px; }\n:focus:not(:focus-visible){ outline:none; }\n\n/* ───────── HEADER ───────── */\n.hdr{ position:sticky; top:0; z-index:60; height:var(--header-h);\n  background:color-mix(in srgb, var(--bg) 92%, transparent);\n  backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);\n  border-bottom:1px solid transparent; transition:border-color var(--base) var(--ease); }\n.hdr.stuck{ border-bottom-color:var(--line); }\n.hdr-in{ max-width:var(--max); margin:0 auto; height:100%; padding:0 var(--pad);\n  display:flex; align-items:center; gap:10px; }\n.wordmark{ font-size:17px; font-weight:800; letter-spacing:-.035em; }\n.wordmark span{ color:var(--brand); }\n.hdr-name{ flex:1; min-width:0; font-size:14px; font-weight:600; letter-spacing:-.01em;\n  opacity:0; transform:translateY(4px); transition:all var(--base) var(--ease);\n  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\n.hdr.stuck .hdr-name{ opacity:1; transform:none; }\n.hdr.stuck .wordmark{ display:none; }\n.spacer{ flex:1; }\n.icon-btn{ width:38px; height:38px; flex:0 0 auto; display:grid; place-items:center;\n  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer;\n  border-radius:var(--r-full); transition:all var(--fast); }\n.icon-btn:hover{ color:var(--ink); border-color:var(--ink-4); }\n.icon-btn:active{ transform:scale(.94); }\n\n/* ───────── IDENTITY CARD ───────── */\n.idcard{ margin-top:16px; border-radius:var(--r-xl); overflow:hidden;\n  border:1px solid var(--line); background:var(--surface-2); box-shadow:var(--sh-3); }\n.cover{ height:92px; position:relative;\n  background:linear-gradient(115deg,#5B54E8,#8B5CF6 45%,#EC4899); }\n.cover::after{ content:''; position:absolute; inset:0;\n  background:radial-gradient(120% 90% at 50% 130%, rgba(0,0,0,.45), transparent 70%); }\n.cover-tags{ position:absolute; inset:12px 12px auto 12px; display:flex;\n  justify-content:space-between; z-index:2; }\n.ctag{ display:inline-flex; align-items:center; gap:6px; font-size:10px; font-weight:800;\n  letter-spacing:.11em; text-transform:uppercase; color:#fff;\n  background:rgba(10,12,20,.42); backdrop-filter:blur(8px);\n  border:1px solid rgba(255,255,255,.18); padding:5px 10px; border-radius:var(--r-full); }\n.live-dot{ width:6px; height:6px; border-radius:50%; background:var(--good);\n  animation:pulse 2.4s var(--ease) infinite; }\n@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(52,211,153,.55);} 55%{ box-shadow:0 0 0 6px rgba(52,211,153,0);} }\n\n.idbody{ padding:0 18px 18px; text-align:center; }\n.avatar{ width:104px; height:104px; margin:-52px auto 12px; position:relative;\n  border-radius:32px; padding:3px; background:var(--surface-2);\n  box-shadow:0 0 0 3px var(--surface-2), var(--sh-3); }\n.avatar .art{ width:100%; height:100%; border-radius:29px; overflow:hidden;\n  background:var(--fig-bg); display:block; }\n.avatar .art svg{ width:100%; height:100%; display:block; }\nh1{ font-size:clamp(1.7rem,7vw,2.15rem); font-weight:800; letter-spacing:-.04em;\n  line-height:1.05; }\nh1 .nm{ font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-weight:400;\n  letter-spacing:-.015em;\n  background:linear-gradient(120deg,var(--brand) 0%,var(--brand-2) 48%,var(--brand-3) 100%);\n  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }\n.tagline{ font-size:13.5px; color:var(--ink-3); margin:7px auto 14px; max-width:320px;\n  line-height:1.5; }\n.tagline b{ color:var(--ink-2); font-weight:600; }\n\n/* projected arrival — native date input, not a bespoke calendar */\n.arrival{ display:inline-flex; align-items:center; gap:10px; position:relative;\n  background:var(--surface-3); border:1px solid var(--line); border-radius:var(--r-lg);\n  padding:10px 14px; cursor:pointer; transition:all var(--fast); }\n.arrival:hover{ border-color:var(--brand); }\n.arrival .lbl{ font-size:9.5px; font-weight:800; letter-spacing:.12em; color:var(--ink-4);\n  text-transform:uppercase; display:block; text-align:left; }\n.arrival .val{ font-family:'Instrument Serif',Georgia,serif; font-style:italic;\n  font-size:20px; line-height:1.15; display:block; text-align:left;\n  background:linear-gradient(100deg,var(--brand),var(--brand-3));\n  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }\n.arrival svg{ color:var(--ink-4); flex:0 0 auto; }\n.arrival input{ position:absolute; inset:0; opacity:0; cursor:pointer;\n  width:100%; height:100%; border:none; }\n.arrival-hint{ font-size:11px; color:var(--ink-4); margin-top:8px; }\n\n.status-row{ display:flex; align-items:center; justify-content:center; gap:9px;\n  margin-top:14px; flex-wrap:wrap; }\n.chip-ok{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;\n  letter-spacing:.05em; color:var(--good); background:rgba(52,211,153,.10);\n  border:1px solid rgba(52,211,153,.24); padding:5px 11px; border-radius:var(--r-full); }\n.kit{ font-size:11px; font-weight:600; color:var(--ink-4); letter-spacing:.04em;\n  font-variant-numeric:tabular-nums; }\n\n/* stats */\n.stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin-top:16px;\n  background:var(--line-2); border:1px solid var(--line-2); border-radius:var(--r-lg);\n  overflow:hidden; }\n.stat{ background:var(--surface-2); padding:11px 4px 10px; text-align:center; }\n.stat .n{ font-size:17px; font-weight:800; letter-spacing:-.03em;\n  font-variant-numeric:tabular-nums; }\n.stat .n u{ text-decoration:none; font-size:10.5px; font-weight:600; color:var(--ink-4);\n  margin-left:1px; }\n.stat .l{ font-size:9.5px; font-weight:700; letter-spacing:.09em; color:var(--ink-4);\n  text-transform:uppercase; margin-top:2px; }\n\n/* completeness — the profile's real job is showing what is and isn't set */\n.completeness{ margin-top:14px; background:var(--surface-3); border:1px solid var(--line);\n  border-radius:var(--r-lg); padding:13px 14px; }\n.cmp-top{ display:flex; align-items:center; justify-content:space-between; gap:10px;\n  margin-bottom:9px; }\n.cmp-lbl{ font-size:12px; font-weight:700; letter-spacing:-.01em; }\n.cmp-pct{ font-size:12px; font-weight:800; color:var(--brand);\n  font-variant-numeric:tabular-nums; }\n.cmp-bar{ height:6px; border-radius:99px; background:var(--surface); overflow:hidden; }\n.cmp-fill{ height:100%; border-radius:99px; width:0%;\n  background:linear-gradient(90deg,var(--brand),var(--brand-2) 55%,var(--brand-3));\n  transition:width var(--slow) var(--ease); }\n.cmp-gaps{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }\n.gap-chip{ font-family:inherit; font-size:11.5px; font-weight:600; cursor:pointer;\n  color:var(--warn); background:rgba(251,191,3 pan class=\"ctag\" id=\"publicId\">MSP-I1XTD\u003c/span>\n      \u003c/div>\n    \u003c/div>\n    \u003cdiv class=\"idbody\">\n      \u003cdiv class=\"avatar\">\u003cdiv class=\"art\" id=\"avatar\" role=\"img\" aria-label=\"Portrait of your descendant\">\u003c/div>\u003c/div>\n      \u003ch1>Meet \u003cspan class=\"nm\" id=\"nameEl\">Ryan\u003c/span>.\u003c/h1>\n      \u003cp class=\"tagline\">A \u003cb>conceptual blueprint\u003c/b> — traits, values, and legacy, captured for the future.\u003c/p>\n\n      \u003cbutton class=\"arrival\" id=\"arrivalBtn\" type=\"button\">\n        \u003cspan>\n          \u003cspan class=\"lbl\">Projected arrival\u003c/span>\n          \u003cspan class=\"val\" id=\"arrivalVal\">June 14, 2050\u003c/span>\n        \u003c/span>\n        \u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M12 20h9\"/>\u003cpath d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z\"/>\u003c/svg>\n        \u003cinput type=\"date\" id=\"arrivalInput\" min=\"2027-01-01\" max=\"2125-12-31\" aria-label=\"Projected arrival date\">\n      \u003c/button>\n      \u003cdiv class=\"arrival-hint\">Tap to amend · aspirational only\u003c/div>\n\n      \u003cdiv class=\"status-row\">\n        \u003cspan class=\"chip-ok\">\n          \u003csvg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>\n          Stored · Active\n        \u003c/span>\n        \u003cspan class=\"kit\" id=\"kitId\">KIT-2026-YI1XTD\u003c/span>\n      \u003c/div>\n\n      \u003cdiv class=\"stats\" id=\"stats\">\u003c/div>\n\n      \u003cdiv class=\"completeness\">\n        \u003cdiv class=\"cmp-top\">\n          \u003cspan class=\"cmp-lbl\">Blueprint completeness\u003c/span>\n          \u003cspan class=\"cmp-pct\" id=\"cmpPct\">0%  no private notes, no personal data.\u003c/div>\n      \u003cdiv class=\"urlbox\">\n        \u003cspan class=\"u\" id=\"shareUrl\">myspawn.me/p/MSP-I1XTD\u003c/span>\n        \u003cbutton id=\"copyBtn\">Copy\u003c/button>\n      \u003c/div>\n    \u003c/div>\n  \u003c/section>\n\n  \u003cdiv class=\"legal\" id=\"legal\">\n    \u003cbutton class=\"legal-hd\" aria-expanded=\"false\" aria-controls=\"legalBd\" id=\"legalBtn\">\n      \u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 16v-4\"/>\u003cpath d=\"M12 8h.01\"/>\u003c/svg>\n      Conceptual record — not a medical, genetic, or reproductive service\n      \u003csvg class=\"chev\" width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"m6 9 6 6 6-6\"/>\u003c/svg>\n    \u003c/button>\n    \u003cdiv class=\"legal-bd\" id=\"legalBd\">\u003cdiv>\n      \u003cp>This profile is a \u003cstrong>conceptual record of your preferences\u003c/strong>. MySpawn performs\n      no genetic, reproductive, medical, or enhancement procedures, and makes no representation\n      that any trait, ability, or arrival date described here will occur. Visuals are generated\n      illustrations, not predictions. Nothing here is binding.\n      \u003ca href=\"#\">Read full terms →\u003c/a>\u003c/p>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"meta-row\">\n    \u003cspan>Created \u003cspan id=\"createdAt\">—\u003c/span>\u003c/span>\n    \u003cspan>Updated \u003cspan id=\"updatedAt\">—\u003c/span>\u003c/span>\n    \u003cspan>v1.11\u003c/span>\n  \u003c/div>\n\n  \u003cdiv class=\"danger\">\u003cbutton id=\"deleteBtn\">Delete this profile\u003c/button>\u003c/div>\n\n  \u003cdiv class=\"foot\">\n    \u003ca href=\"#\">Privacy\u003c/a>·\u003ca href=\"#\">Terms\u003c/a>·\u003ca href=\"#\">FAQ\u003c/a>\u003cbr>\n    © 2026 MySpawn Inc.\n  \u003c/div>\n\u003c/main>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\n\u003cdiv class=\"dock\">\n  \u003cdiv class=\"dock-in\">\n    \u003cbutton class=\"cta\" id=\"shareBtn\">\n      \u003csvg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"18\" cy=\"5\" r=\"3\"/>\u003ccircle cx=\"6\" cy=\"12\" r=\"3\"/>\u003ccircle cx=\"18\" cy=\"19\" r=\"3\"/>\u003cpath d=\"M8.6 13.5l6.8 4M15.4 6.5l-6.8 4\"/>\u003c/svg>\n      \u003cspan id=\"shareLabel\">Share profile\u003c/span>\n    \u003c/button>\n    \u003cbutton class=\"cta2\" id=\"dockPdf\">\n      \u003csvg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4\"/>\u003cpath d=\"m7 10 5 5 5-5M12 15V3\"/>\u003c/svg>\n      PDF\n    \u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n'use strict';\n\n/* ═══════════ 1 · SHARED RENDER ENGINES ═══════════\n   Same geometry as the Identity and Body designers, so the profile shows the\n   descendant that was actually designed rather than a placeholder. */\nconst n = v => Math.round(v * 10) / 10;\n\nfunction shade(hex, amt) {\n  const v = parseInt(hex.slice(1), 16);\n  const ch = [(v >> 16) & 255, (v >> 8) & 255, v & 255].map(c => {\n    const x = amt \u003c 0 ? c * (1 + amt) : c + (255 - c) * amt;\n    return Math.max(0, Math.min(255, Math.round(x)));\n  });\n  return '#' + ((ch[0] \u003c\u003c 16) | (ch[1] \u003c\u003c 8) | ch[2]).toString(16).padStart(6, '0');\n}\nfunction lum(hex) {\n  const v = parseInt(hex.slice(1), 16);\n  return (0.2126*((v>>16)&255) + 0.7152*((v>>8)&255) + 0.0722*(v&255)) / 255;\n}\nconst contrastLine = (skin, k) => lum(skin) \u003c 0.38 ? shade(skin, k * .85) : shade(skin, -k);\n\n/* ── FACE ── */\nconst SKIN_HEX = { Fair:'#F3DCC6', Light:'#EDC7A6', Medium:'#D8A277', Olive:'#C08E60',\n                   Tan:'#B0764B', Brown:'#8A5732', Deep:'#5C3A22' };\nconst HAIR_HEX = { Black:'#1B1917', Brown:'#5A3825', Blonde:'#D8B27F',\n                   Red:'#A64B2A', Grey:'#9AA1AE', White:'#E7E5E2' };\nconst EYE_HEX  = { Brown:'#6B4423', Blue:'#5B8DC4', Green:'#4E8A5E',\n                   Hazel:'#9A7B4F', Grey:'#8C95A5', Amber:'#C68A3E' };\nconst ANCESTRY = { 'Asian':{skin:'#E9C6A0',hair:'#1B1917'}, 'Latino':{skin:'#D2A276',hair:'#3B2418'},\n  'African':{skin:'#7A4E32',hair:'#1B1917'}, 'Caucasian':{skin:'#EFC9A8',hair:'#6B4A2F'},\n  'Middle Eastern':{skin:'#D6A97A',hair:'#2A1D14'}, 'Mixed Race':{skin:'#C08E60',hair:'#2E2119'} };\nconst SHAPE = {\n  'Oval':{fw:45,cw:53,jw:37,chin:190,sharp:.46,foreY:66,cheekY:112,jawY:157},\n  'Round':{fw:55,cw:63,jw:52,chin:173,sharp:.70,foreY:62,cheekY:106,jawY:143},\n  'Square':{fw:57,cw:59,jw:57,chin:181,sharp:.07,foreY:60,cheekY:105,jawY:151},\n  'Heart':{fw:59,cw:56,jw:26,chin:193,sharp:.30,foreY:60,cheekY:103,jawY:152},\n  'Diamond':{fw:33,cw:64,jw:29,chin:195,sharp:.26,foreY:73,cheekY:115,jawY:159},\n  'Oblong':{fw:42,cw:45,jw:38,chin:209,sharp:.50,foreY:68,cheekY:120,jawY:171} };\nconst JAW = { 'Soft':{jw:.87,sharp:+.30,chin:+3}, 'Defined':{jw:1.07,sharp:-.18,chin:-1},\n  'Angular':{jw:1.17,sharp:-.36,chin:-7}, 'Rounded':{jw:.85,sharp:+.44,chin:+6} };\nconst BROW = '\u003cpath d=\"M9 38h22\" stroke-dasharray=\"3 3\" opacity=\".42\"/>';\nconst HAIRLINE = {\n  'Natural':{dy:0,curve:(fw,y)=>`C${n(100+fw*.72)} ${n(y-13)} ${n(100-fw*.72)} ${n(y-13)} ${n(100-fw)} ${n(y)}`},\n  'High':{dy:12,curve:(fw,y)=>`C${n(100+fw*.72)} ${n(y-9)} ${n(100-fw*.72)} ${n(y-9)} ${n(100-fw)} ${n(y)}`},\n  'Straight':{dy:3,curve:(fw,y)=>`L${n(100-fw)} ${n(y)}`},\n  \"Widow's Peak\":{dy:-1,curve:(fw,y)=>`C${n(100+fw*.72)} ${n(y-15)} ${n(100+15)} ${n(y-14)} 100 ${n(y+8)}`+`C${n(100-15)} ${n(y-14)} ${n(100-fw*.72)} ${n(y-15)} ${n(100-fw)} ${n(y)}`},\n  'Receding':{dy:9,curve:(fw,y)=>`C${n(100+fw*.82)} ${n(y-24)} ${n(100+fw*.46)} ${n(y-15)} 100 ${n(y-14)}`+`C${n(100-fw*.46)} ${n(y-15)} ${n(100-fw*.82)} ${n(y-24)} ${n(100-fw)} ${n(y)}`},\n  'M-Shaped':{dy:7,curve:(fw,y)=>`C${n(100+fw*.88)} ${n(y-21)} ${n(100+fw*.46)} ${n(y-23)} ${n(100+fw*.33)} ${n(y-5)}`+`C${n(100+fw*.18)} ${n(y-21)} ${n(100-fw*.18)} ${n(y-21)} ${n(100-fw*.33)} ${n(y-5)}`+`C${n(100-fw*.46)} ${n(y-23)} ${n(100-fw*.88)} ${n(y-21)} ${n(100-fw)} ${n(y)}`} };\nconst HSTYLE = { 'Buzz':{side:-16,back:0,crown:4}, 'Short':{side:-12,back:0,crown:13},\n  'Medium':{side:18,back:34,crown:15}, 'Long':{side:26,back:86,crown:16},\n  'Curly':{side:2,back:22,crown:20}, 'Wavy':{side:10,back:30,crown:17}, 'Braids':{side:-6,back:30,crown:12} };\nconst EXPR = { 'Confident':{open:.86,brow:-5,browY:-1,mouth:8,mouthW:1.02},\n  'Calm':{open:.78,brow:0,browY:2,mouth:3,mouthW:.90},\n  'Intense':{open:.60,brow:10,browY:-5,mouth:-1,mouthW:.86},\n  'Friendly':{open:.94,brow:-7,browY:-4,mouth:15,mouthW:1.16},\n  'Serious':{open:.72,brow:3,browY:1,mouth:-5,mouthW:.96} };\nconst NOSE = { 'Small':{w:6.5,len:10}, 'Medium':{w:9,len:14}, 'Large':{w:12.5,len:19} };\n\nfunction facePath(g) {\n  const { fw, cw, jw, chin, sharp, foreY, cheekY, jawY } = g, top = 30;\n  const s = Math.max(.05, Math.min(.9, sharp));\n  return [`M100 ${top}`,\n    `C${n(100+fw*.6)} ${top} ${n(100+fw)} ${n(top+(foreY-top)*.5)} ${n(100+fw)} ${n(foreY)}`,\n    `C${n(100+fw)} ${n(foreY+(cheekY-foreY)*.45)} ${n(100+cw)} ${n(cheekY-(cheekY-foreY)*.5)} ${n(100+cw)} ${n(cheekY)}`,\n    `C${n(100+cw)} ${n(cheekY+(jawY-cheekY)*.58)} ${n(100+jw+(cw-jw)*.4)} ${n(jawY-(jawY-cheekY)*.1)} ${n(100+jw)} ${n(jawY)}`,\n    `C${n(100+jw)} ${n(jawY+(chin-jawY)*s)} ${n(100+jw*s)} ${n(chin)} 100 ${n(chin)}`,\n    `C${n(100-jw*s)} ${n(chin)} ${n(100-jw)} ${n(jawY+(chin-jawY)*s)} ${n(100-jw)} ${n(jawY)}`,\n    `C${n(100-jw-(cw-jw)*.4)} ${n(jawY-(jawY-cheekY)*.1)} ${n(100-cw)} ${n(cheekY+(jawY-cheekY)*.58)} ${n(100-cw)} ${n(cheekY)}`,\n    `C${n(100-cw)} ${n(cheekY-(cheekY-foreY)*.5)} ${n(100-fw)} ${n(foreY+(cheekY-foreY)*.45)} ${n(100-fw)} ${n(foreY)}`,\n    `C${n(100-fw)} ${n(top+(foreY-top)*.5)} ${n(100-fw*.6)} ${top} 100 ${top}Z`].join('');\n}\nfunction hairPath(g, style, hairline) {\n  const { fw, cheekY } = g, top = 30;\n  const hl = HAIRLINE[hairline] || HAIRLINE['Natural'];\n  const st = HSTYLE[style] || HSTYLE['Short'];\n  const hy = top + 36 + hl.dy, sideY = cheekY + st.side, cr = top - st.crown;\n  return `M${n(100-fw-7)} ${n(sideY)}`\n       + `C${n(100-fw-8)} ${n(cr+22)} ${n(100-fw*.55)} ${n(cr)} 100 ${n(cr)}`\n       + `C${n(100+fw*.55)} ${n(cr)} ${n(100+fw+8)} ${n(cr+22)} ${n(100+fw+7)} ${n(sideY)}`\n       + `L${n(100+fw)} ${n(sideY-4)}L${n(100+fw)} ${n(hy)}` + hl.curve(fw, hy)\n       + `L${n(100-fw)} ${n(sideY-4)}Z`;\n}\nfunction backHairPath(g, style) {\n  const st = HSTYLE[style] || HSTYLE['Short'];\n  if (!st.back) return '';\n  const { cw, cheekY, chin } = g, b = cheekY + st.back;\n  return `M${n(100-cw-5)} ${n(cheekY-34)}`\n       + `C${n(100-cw-17)} ${n(cheekY+st.back*.5)} ${n(100-cw-13)} ${n(b+14)} ${n(100-cw+4)} ${n(Math.min(b+22, chin+26))}`\n       + `L${n(100+cw-4)} ${n(Math.min(b+22, chin+26))}`\n       + `C${n(100+cw+13)} ${n(b+14)} ${n(100+cw+17)} ${n(cheekY+st.back*.5)} ${n(100+cw+5)} ${n(cheekY-34)}Z`;\n}\nfunction renderFace(p, uid, view) {\n  p = p || {};\n  const anc = ANCESTRY[p.race] || {};\n  const skin = SKIN_HEX[p.skin] || anc.skin || '#E7C6A4';\n  const hairCol = HAIR_HEX[p.haircolor] || anc.hair || '#3A2A22';\n  const eyeCol = EYE_HEX[p.eye] || '#6B4423';\n  const base = SHAPE[p.shape] || SHAPE['Oval'];\n  const jm = JAW[p.jaw] || { jw:1, sharp:0, chin:0 };\n  const g = { ...base, jw:base.jw*jm.jw, sharp:base.sharp+jm.sharp, chin:base.chin+jm.chin };\n  const ex = EXPR[p.expression] || EXPR['Calm'];\n  const nose = NOSE[p.nose] || NOSE['Medium'];\n  const style = p.hairstyle || 'Short', hairline = p.hairline || 'Natural';\n  const { cw, cheekY, chin } = g;\n  const eyeY = cheekY + 3, eyeX = cw*.45, eyeRy = 7.4*ex.open;\n  const browY = eyeY - 19 + ex.browY, noseY = eyeY + nose.len + 9;\n  const mouthY = noseY + (chin - noseY)*.46;\n  const dark = lum(skin) \u003c .38;\n  const shadow = dark ? shade(skin, .12) : shade(skin, -.16);\n  const line = contrastLine(skin, .42), mouthC = contrastLine(skin, .55);\n  const browC = dark && lum(hairCol) \u003c .25 ? shade(hairCol, .34) : shade(hairCol, -.1);\n  const eye = sx => `\n    \u003cellipse cx=\"${n(100+sx*eyeX)}\" cy=\"${n(eyeY)}\" rx=\"11.4\" ry=\"${n(eyeRy)}\" fill=\"#fff\"/>\n    \u003ccircle cx=\"${n(100+sx*eyeX)}\" cy=\"${n(eyeY)}\" r=\"${n(Math.min(6.6, eyeRy*.95))}\" fill=\"${eyeCol}\"/>\n    \u003ccircle cx=\"${n(100+sx*eyeX)}\" cy=\"${n(eyeY)}\" r=\"${n(Math.min(3, eyeRy*.44))}\" fill=\"#17130F\"/>\n    \u003ccircle cx=\"${n(100+sx*eyeX-2.2)}\" cy=\"${n(eyeY-2.4)}\" r=\"1.5\" fill=\"#fff\" opacity=\".9\"/>\n    \u003cpath d=\"M${n(100+sx*eyeX-11.4)} ${n(eyeY)}a11.4 ${n(eyeRy)} 0 0 1 22.8 0\" fill=\"none\" stroke=\"${line}\" stroke-width=\"1.9\" stroke-linecap=\"round\"/>`;\n  const brow = sx => `\u003cpath d=\"M${n(100+sx*(eyeX-11))} ${n(browY+ex.brow)} Q${n(100+sx*eyeX)} ${n(browY-5)} ${n(100+sx*(eyeX+11))} ${n(browY-ex.brow*.4)}\" fill=\"none\" stroke=\"${browC}\" stroke-width=\"3.4\" stroke-linecap=\"round\"/>`;\n  const edge = Math.abs(lum(hairCol) - lum(skin)) \u003c .17;\n  return `\n\u003csvg viewBox=\"${view || '0 0 200 250'}\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\">\n  \u003cdefs>\u003cclipPath id=\"fc${uid}\">\u003cpath d=\"${facePath(g)}\"/>\u003c/clipPath>\u003c/defs>\n  ${backHairPath(g,style) ? `\u003cpath d=\"${backHairPath(g,style)}\" fill=\"${shade(hairCol,-.18)}\"/>` : ''}\n  \u003cpath d=\"M${n(100-17)} ${n(chin-18)}h34v28q0 10 -17 12q-17 -2 -17 -12Z\" fill=\"${shadow}\"/>\n  \u003cpath d=\"M${n(100-58)} 250q6 -30 30 -37q14 -4 28 -4t28 4q24 7 30 37Z\" fill=\"rgba(118,126,168,.42)\"/>\n  \u003cellipse cx=\"${n(100-cw+1)}\" cy=\"${n(cheekY+8)}\" rx=\"7\" ry=\"11\" fill=\"${shadow}\"/>\n  \u003cellipse cx=\"${n(100+cw-1)}\" cy=\"${n(cheekY+8)}\" rx=\"7\" ry=\"11\" fill=\"${shadow}\"/>\n  \u003cpath d=\"${facePath(g)}\" fill=\"${skin}\"/>\n  \u003cg clip-path=\"url(#fc${uid})\">\n    \u003cellipse cx=\"${n(100-cw*.62)}\" cy=\"${n(cheekY+16)}\" rx=\"15\" ry=\"9\" fill=\"${shade(skin,-.07)}\" opacity=\".55\"/>\n    \u003cellipse cx=\"${n(100+cw*.62)}\" cy=\"${n(cheekY+16)}\" rx=\"15\" ry=\"9\" fill=\"${shade(skin,-.07)}\" opacity=\".55\"/>\n  \u003c/g>\n  ${brow(-1)}${brow(1)}${eye(-1)}${eye(1)}\n  \u003cpath d=\"M100 ${n(eyeY+6)}v${n(nose.len)}q0 5 ${n(-nose.w*.55)} 6\" fill=\"none\" stroke=\"${line}\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\".7\"/>\n  \u003cpath d=\"M${n(100-nose.w)} ${n(noseY)}q${n(nose.w)} ${n(nose.w*.6)} ${n(nose.w*2)} 0\" fill=\"none\" stroke=\"${line}\" stroke-width=\"2.1\" stroke-linecap=\"round\" opacity=\".8\"/>\n  \u003cpath d=\"M${n(100-15*ex.mouthW)} ${n(mouthY)}Q100 ${n(mouthY+ex.mouth)} ${n(100+15*ex.mouthW)} ${n(mouthY)}\" fill=\"none\" stroke=\"${mouthC}\" stroke-width=\"2.6\" stroke-linecap=\"round\"/>\n  \u003cpath d=\"${hairPath(g,style,hairline)}\" fill=\"${hairCol}\" ${edge ? `stroke=\"${shade(hairCol, lum(hairCol)>.5 ? -.28 : .28)}\" stroke-width=\"1.6\"` : ''}/>\n\u003c/svg>`;\n}\n\n/* ── BODY (line art, matching the Body designer) ── */\nconst BUILD_M = {\n  'Lean':{sh:38,ch:32,wa:23,hi:30,arm:6.5,thigh:14,calf:9.0,neck:9},\n  'Athletic':{sh:47,ch:39,wa:27,hi:34,arm:8.5,thigh:18,calf:11.0,neck:11},\n  'Muscular':{sh:56,ch:47,wa:33,hi:39,arm:11.5,thigh:23,calf:13.5,neck:14},\n  'Average':{sh:42,ch:37,wa:34,hi:38,arm:8.0,thigh:19,calf:11.0,neck:10.5},\n  'Stocky':{sh:49,ch:46,wa:44,hi:46,arm:10.5,thigh:23,calf:13.0,neck:13} };\nconst BUILD_F = {\n  'Lean':{sh:33,ch:30,wa:19,hi:34,arm:5.4,thigh:14,calf:8.4,neck:8},\n  'Athletic':{sh:40,ch:35,wa:22,hi:40,arm:6.9 .sh-6)} ${n(100+sh*.62)} ${n(BY.sh-11)} ${n(100+sh*.28)} ${n(BY.sh-13)}`\n    + `Q100 ${n(BY.sh-16)} ${n(100-sh*.28)} ${n(BY.sh-13)}Z`;\n}\nfunction bodyDef(b, absKey, sex) {\n  const a = ABS[absKey];\n  const st = `fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"`;\n  let d = '';\n  if (sex === 'Female') for (const sx of [-1,1])\n    d += `\u003cpath d=\"M${n(100+sx*b.ch*.72)} ${n(BY.ch-20)}C${n(100+sx*b.ch*.74)} ${n(BY.ch-2)} ${n(100+sx*b.ch*.40)} ${n(BY.ch+6)} ${n(100+sx*b.ch*.13)} ${n(BY.ch-4)}\" ${st} opacity=\".55\"/>`;\n  if (!a || !a.rows) return d;\n  const top = BY.ch+16, gap = (BY.wa-top-8)/a.rows;\n  d += `\u003cpath d=\"M100 ${n(BY.ch-4)}v18\" ${st} opacity=\"${a.op}\"/>`;\n  d += `\u003cpath d=\"M${n(100-b.ch*.68)} ${n(BY.ch+4)}q${n(b.ch*.68)} 13 ${n(b.ch*1.36)} 0\" ${st} opacity=\"${a.op*.8}\"/>`;\n  d += `\u003cpath d=\"M100 ${n(top)}V${n(BY.wa-6)}\" ${st} opacity=\"${a.op}\"/>`;\n  for (let i=1;i\u003c=a.rows;i++){ const y=top+gap*i, w=b.wa*(0.66-i*0.045);\n    d += `\u003cpath d=\"M${n(100-w)} ${n(y)}q${n(w)} 4 ${n(w*2)} 0\" ${st} opacity=\"${a.op}\"/>`; }\n  if (a.obliq) for (const sx of [-1,1])\n    d += `\u003cpath d=\"M${n(100+sx*b.wa*.82)} ${n(BY.ch+30)}C${n(100+sx*b.wa*.92)} ${n(BY.wa-24)} ${n(100+sx*b.wa*.74)} ${n(BY.wa-6)} ${n(100+sx*b.wa*.46)} ${n(BY.wa+6)}\" ${st} opacity=\"${a.obliq}\"/>`;\n  return d;\n}\nconst heightScale = i => i == null ? 1 : 1 + (Math.max(59, Math.min(83, i)) - 69)/69*0.34;\nfunction renderBody(p, opts = {}) {\n  p = p || {};\n  const uid = opts.uid || 'b', sw = opts.sw || 4.2, hr = 21;\n  const sex = p.sex || null;\n  const b = (sex === 'Female' ? BUILD_F : BUILD_M)[p.build] || (sex === 'Female' ? DEFAULT_F : DEFAULT_M);\n  const absKey = p.abs || IMPLIED_ABS[p.build] || null;\n  return `\n\u003csvg viewBox=\"${opts.view || '0 0 200 420'}\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\">\n  \u003cg transform=\"translate(0 ${n(BMID)}) scale(1 ${n(heightScale(p.height))}) transla
