<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0B0D14" />
<title>MySpawn — Design Your Descendant</title>
<style>
/* ═══════════════════════════════════════════════════════
   MySpawn — fbd 1.3 (face → body → descendant profile)
   One file. Each room is the intact 1.11 page in its own
   frame; rooms share localStorage; the shell only swaps
   steps when a room posts fbd:next / fbd:back / fbd:goto.
   ═══════════════════════════════════════════════════════ */
html,body{ margin:0; padding:0; height:100%; background:#0B0D14; }
.step{ position:fixed; inset:0; border:0; width:100%; height:100%;
  opacity:0; pointer-events:none; transition:opacity .28s ease; background:transparent; }
.step.on{ opacity:1; pointer-events:auto; }
</style>
</head>
<body>
<iframe class="step" id="step-face" title="Room 1 — Design their face"></iframe>
<iframe class="step" id="step-body" title="Room 2 — Shape their body"></iframe>
<iframe class="step" id="step-profile" title="Descendant profile"></iframe>
<script>
'use strict';
const PAGES = {
  face: "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\" />\n\u003cmeta name=\"theme-color\" content=\"#FBFBFE\" media=\"(prefers-color-scheme: light)\" />\n\u003cmeta name=\"theme-color\" content=\"#0B0D14\" media=\"(prefers-color-scheme: dark)\" />\n\u003ctitle>MySpawn — Design Their Identity\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n/* ═══════════════════════════════════════════════════════════\n   MySpawn — Identity Designer 1.11\n   Design system\n   ═══════════════════════════════════════════════════════════ */\n*,*::before,*::after { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }\n\n:root{\n  /* Neutrals */\n  --ink:#101425;\n  --ink-2:#333B54;\n  --ink-3:#5A6485;\n  --ink-4:#8C95B2;\n\n  /* Surfaces */\n  --bg:#FBFBFE;\n  --surface:#FFFFFF;\n  --surface-2:#F5F5FB;\n  --line:#E9E9F4;\n  --line-2:#F2F2F9;\n\n  /* Brand */\n  --brand:#5B54E8;\n  --brand-2:#8B5CF6;\n  --brand-3:#EC4899;\n  --brand-tint:rgba(91,84,232,.07);\n  --brand-tint-2:rgba(91,84,232,.14);\n\n  /* Shape */\n  --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:999px;\n\n  /* Elevation */\n  --sh-1:0 1px 2px rgba(16,20,37,.04), 0 1px 3px rgba(16,20,37,.03);\n  --sh-2:0 2px 8px -2px rgba(16,20,37,.06), 0 8px 24px -12px rgba(16,20,37,.10);\n  --sh-3:0 8px 32px -12px rgba(16,20,37,.16);\n  --sh-brand:0 8px 28px -10px rgba(91,84,232,.5);\n\n  /* Motion */\n  --ease:cubic-bezier(.32,.72,0,1);\n  --spring:cubic-bezier(.34,1.4,.5,1);\n  --fast:.16s; --base:.28s; --slow:.44s;\n\n  /* Layout */\n  --pad:20px;\n  --max:560px;\n  --header-h:60px;\n  --sab:env(safe-area-inset-bottom, 0px);\n}\n\n@media (prefers-color-scheme: dark){\n  :root{\n    --ink:#F3F4FB; --ink-2:#C7CBDE; --ink-3:#959CBA; --ink-4:#6B7396;\n    --bg:#0B0D14; --surface:#141722; --surface-2:#1A1D2B;\n    --line:#262B3D; --line-2:#1E2231;\n    --brand:#8B84FF; --brand-2:#A78BFA; --brand-3:#F472B6;\n    --brand-tint:rgba(139,132,255,.10); --brand-tint-2:rgba(139,132,255,.20);\n    --sh-1:0 1px 2px rgba(0,0,0,.3);\n    --sh-2:0 2px 8px -2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);\n    --sh-3:0 8px 32px -12px rgba(0,0,0,.6);\n  }\n}\n\nhtml{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }\nbody{\n  background:var(--bg);\n  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  -moz-osx-font-smoothing:grayscale;\n  line-height:1.5;\n  font-size:16px;\n  overscroll-behavior-y:none;\n  overflow-x:hidden;\n  padding-bottom:calc(120px + var(--sab));\n  min-height:100dvh;\n}\n\n/* Ambient field — fixed, cheap, non-interactive */\n.ambient{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }\n.ambient i{ position:absolute; border-radius:50%; filter:blur(0px); display:block; }\n.ambient i:nth-child(1){ top:-220px; left:-140px; width:460px; height:460px;\n  background:radial-gradient(circle,rgba(139,92,246,.16),transparent 68%); }\n.ambient i:nth-child(2){ top:180px; right:-200px; width:480px; height:480px;\n  background:radial-gradient(circle,rgba(91,84,232,.13),transparent 68%); }\n.ambient i:nth-child(3){ bottom:-180px; left:-100px; width:400px; height:400px;\n  background:radial-gradient(circle,rgba(236,72,153,.09),transparent 68%); }\n\n.shell{ position:relative; z-index:1; max-width:var(--max); margin:0 auto; padding:0 var(--pad); }\n\n/* Accessibility */\n.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;\n  clip:rect(0 0 0 0); white-space:nowrap; border:0; }\n:focus-visible{ outline:2.5px solid var(--brand); outline-offset:3px; border-radius:6px; }\n:focus:not(:focus-visible){ outline:none; }\n\n/* ───────────── HEADER ───────────── */\n.hdr{\n  position:sticky; top:0; z-index:60; height:var(--header-h);\n  background:color-mix(in srgb, var(--bg) 94%, transparent);\n  backdrop-filter:blur(24px) saturate(180%);\n  -webkit-backdrop-filter:blur(24px) saturate(180%);\n  border-bottom:1px solid transparent;\n  transition:border-color var(--base) var(--ease), background var(--base);\n}\n.hdr.stuck{ border-bottom-color:var(--line); }\n.hdr-in{\n  max-width:var(--max); margin:0 auto; height:100%;\n  padding:0 var(--pad); display:flex; align-items:center; gap:12px;\n}\n.icon-btn{\n  width:40px; height:40px; flex:0 0 auto; display:grid; place-items:center;\n  border:none; background:transparent; color:var(--ink-2); cursor:pointer;\n  border-radius:var(--r-full); transition:background var(--fast), color var(--fast);\n}\n.icon-btn:hover{ background:var(--surface-2); color:var(--ink); }\n.icon-btn:active{ transform:scale(.94); }\n\n.hdr-mid{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }\n.hdr-kicker{\n  font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;\n  color:var(--brand); display:flex; align-items:center; gap:6px;\n}\n.pulse{ width:5px; height:5px; border-radius:50%; background:var(--brand); flex:0 0 auto;\n  animation:pulse 2.4s var(--ease) infinite; }\n@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(91,84,232,.45);} 55%{ box-shadow:0 0 0 6px rgba(91,84,232,0);} }\n.hdr-title{\n  font-size:14px; font-weight:600; letter-spacing:-.01em; color:var(--ink);\n  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\n}\n\n/* Progress ring */\n.ring{ position:relative; width:40px; height:40px; flex:0 0 auto; }\n.ring svg{ transform:rotate(-90deg); display:block; }\n.ring .trk{ stroke:var(--line); }\n.ring .val{ stroke:url(#ringGrad); stroke-linecap:round;\n  transition:stroke-dashoffset var(--slow) var(--ease); }\n.ring b{\n  position:absolute; inset:0; display:grid; place-items:center;\n  font-size:11px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums;\n  letter-spacing:-.02em;\n}\n\n/* ───────────── HERO ───────────── */\n.hero{ padding:26px 0 4px; text-align:center; }\n.portrait{\n  width:104px; height:104px; margin:0 auto 20px; position:relative;\n  border-radius:30px; padding:3px;\n  background:linear-gradient(140deg,var(--brand),var(--brand-2) 55%,var(--brand-3));\n  box-shadow:var(--sh-3);\n}\n.portrait img, .portrait .ph{\n  width:100%; height:100%; border-radius:27px; object-fit:cover; display:block;\n  background:var(--surface-2);\n}\n.portrait .ph{ display:grid; place-items:center; color:var(--ink-4); }\n.portrait::after{\n  content:attr(data-badge); position:absolute; bottom:-9px; left:50%; transform:translateX(-50%);\n  font-size:8.5px; font-weight:800; letter-spacing:.12em; color:#fff;\n  background:var(--ink); padding:3px 9px; border-radius:var(--r-full);\n  box-shadow:var(--sh-2); white-space:nowrap;\n}\n.portrait .sketch{ width:100%; height:100%; border-radius:27px; overflow:hidden; display:block;\n  background:var(--surface-2); color:var(--ink-3); }\n.portrait .sketch svg{ width:100%; height:100%; display:block; }\n.sketch-cap{ font-size:11.5px; font-weight:600; color:var(--ink-4); margin:-6px 0 14px; }\n.sketch-cap[hidden]{ display:none; }\n@media (prefers-color-scheme: dark){ .portrait::after{ background:#2A3048; } }\n\nh1{\n  font-size:clamp(2rem,8.5vw,2.7rem); font-weight:800; letter-spacing:-.045em;\n  line-height:1.02; margin-bottom:12px;\n}\nh1 .nm{\n  font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-weight:400;\n  letter-spacing:-.015em; padding-right:.04em;\n  background:linear-gradient(120deg,var(--brand) 0%,var(--brand-2) 48%,var(--brand-3) 100%);\n  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;\n}\n.lede{\n  font-size:15px; color:var(--ink-3); max-width:330px; margin:0 auto 20px;\n  letter-spacing:-.008em; line-height:1.55;\n}\n.lede b{ color:var(--ink-2); font-weight:600; }\n\n.hero-actions{ display:flex; justify-content:center; }\n.ghost-btn{\n  font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-3);\n  background:var(--surface); border:1px solid var(--line); cursor:pointer;\n  padding:9px 16px; border-radius:var(--r-full); display:inline-flex; align-items:center; gap:7px;\n  transition:all var(--fast) var(--ease); box-shadow:var(--sh-1);\n}\n.ghost-btn:hover{ color:var(--ink); border-color:var(--ink-4); transform:translateY(-1px); }\n.ghost-btn:active{ transform:scale(.97); }\n\n/* ───────────── BLUEPRINT STRIP (sticky, materializes on first choice) ───────────── */\n.strip-mount{ position:sticky; top:var(--header-h); z-index:50; margin:0 calc(var(--pad) * -1); }\n.strip{\n  max-height:0; opacity:0; overflow:hidden;\n  transition:max-height var(--base) var(--ease), opacity var(--fast) var(--ease);\n  background:color-mix(in srgb, var(--bg) 95%, transparent);\n  backdrop-filter:blur(22px) saturate(180%); -webkit-backdrop-filter:blur(22px) saturate(180%);\n}\n.strip.on{ max-height:58px; opacity:1; border-bottom:1px solid var(--line); }\n.strip-in{\n  max-width:var(--max); margin:0 auto; padding:9px var(--pad);\n  display:flex; align-items:center; gap:8px; overflow-x:auto;\n  scrollbar-width:none; -ms-overflow-style:none;\n  /* fade the right edge so it reads as scrollable */\n  -webkit-mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent 100%);\n  mask-image:linear-gradient(to right,#000 calc(100% - 34px),transparent 100%);\n}\n.strip-in::-webkit-scrollbar{ display:none; }\n.strip-lbl{\n  flex:0 0 auto; font-size:9.5px; font-weight:800; letter-spacing:.12em;\n  color:var(--brand); text-transform:uppercase; padding-right:2px;\n}\n.stamp{\n  flex:0 0 auto; display:inline-flex; align-items:center; gap:6px;\n  font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink); white-space:nowrap;\n  background:var(--brand-tint); border:1px solid var(--brand-tint-2);\n  padding:5px 11px; border-radius:var(--r-full); cursor:pointer;\n  animation:stampIn .42s var(--spring) both;\n  transition:border-color var(--fast), background var(--fast);\n}\n.stamp:hover{ border-color:var(--brand); }\n.stamp:active{ transform:scale(.95); }\n@keyframes stampIn{ from{ opacity:0; transform:scale(.6) translateY(4px);} to{ opacity:1; transform:none;} }\n.stamp .tk{ font-size:9.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;\n  color:var(--ink-4); }\n.stamp .sw{ width:11px; height:11px; border-radius:50%; flex:0 0 auto;\n  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14); }\n\n/* ───────────── SECTIONS ───────────── */\n.sections{ margin-top:26px; display:flex; flex-direction:column; gap:14px; }\n\n.sect{\n  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-xl);\n  box-shadow:var(--sh-2); overflow:hidden;\n  transition:border-color var(--base) var(--ease), box-shadow var(--base) var(--ease);\n}\n@media (prefers-color-scheme: dark){\n  .sect{ background:rgba(26,29,43,.62); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }\n}\n.sect.complete{ border-color:var(--brand-tint-2); }\n\n.sect-hd{\n  display:flex; align-items:center; gap:11px;\n  padding:15px 18px 13px; border-bottom:1px solid var(--line-2);\n}\n.sect-ico{\n  width:30px; height:30px; flex:0 0 auto; border-radius:10px; display:grid; place-items:center;\n  background:var(--brand-tint); color:var(--brand);\n  transition:background var(--base), color var(--base);\n}\n.sect.complete .sect-ico{ background:var(--brand); color:#fff; }\n.sect-nm{ flex:1; font-size:14.5px; font-weight:700; letter-spacing:-.015em; }\n.sect-ct{\n  font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--ink-4);\n  font-variant-numeric:tabular-nums;\n}\n.sect.complete .sect-ct{ color:var(--brand); }\n\n/* ───────────── TRAIT ROW ───────────── */\n.row{ border-bottom:1px solid var(--line-2); scroll-margin-top:calc(var(--header-h) + 66px); }\n.row:last-child{ border-bottom:0; }\n\n.row-hd{\n  width:100%; display:flex; align-items:center; gap:12px; text-align:left;\n  padding:15px 18px; background:transparent; border:none; cursor:pointer;\n  font-family:inherit; color:inherit;\n  transition:background var(--fast) var(--ease);\n}\n.row-hd:hover{ background:var(--surface-2); }\n.row.open > .row-hd{ background:var(--surface-2); }\n\n.dot{\n  width:19px; height:19px; flex:0 0 auto; border-radius:50%; position:relative;\n  border:1.8px solid var(--line); background:transparent;\n  transition:all var(--base) var(--spring);\n}\n.row.set .dot{ border-color:var(--brand); background:var(--brand); }\n.dot svg{ position:absolute; inset:0; margin:auto; width:11px; height:11px; color:#fff;\n  opacity:0; transform:scale(.4); transition:all var(--base) var(--spring); }\n.row.set .dot svg{ opacity:1; transform:scale(1); }\n.row.open .dot{ border-color:var(--brand); }\n\n.row-txt{ flex:1; min-width:0; }\n.row-lbl{ font-size:15px; font-weight:600; letter-spacing:-.015em; display:block; }\n.row-hint{\n  font-size:12.5px; color:var(--ink-4); letter-spacing:-.005em; display:block;\n  margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\n}\n.row.set .row-hint, .row.open .row-hint{ display:none; }\n\n.row-val{\n  display:none; align-items:center; gap:6px; font-size:13px; font-weight:600;\n  color:var(--brand); max-width:44%; margin-top:1px;\n}\n.row.set:not(.open) .row-val{ display:inline-flex; }\n.row-val .sw{ width:12px; height:12px; border-radius:50%; flex:0 0 auto;\n  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14); }\n.row-val span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n\n.chev{ flex:0 0 auto; color:var(--ink-4); transition:transform var(--base) var(--ease); }\n.row.open .chev{ transform:rotate(180deg); color:var(--brand); }\n\n/* Expanding panel — grid-rows trick keeps it height-agnostic & smooth */\n.row-pn{ display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--base) var(--ease); }\n.row.open .row-pn{ grid-template-rows:1fr; }\n.row-pn > div{ overflow:hidden; }\n.row-pn-in{ padding:2px 18px 20px; }\n\n.row-ask{ font-size:13px; color:var(--ink-3); margin-bottom:14px; letter-spacing:-.005em; }\n\n/* ── Option: pill ── */\n.opts{ display:flex; flex-wrap:wrap; gap:8px; }\n.pill{\n  font-family:inherit; font-size:14px; font-weight:500; color:var(--ink-2);\n  background:var(--surface); border:1px solid var(--line); cursor:pointer;\n  padding:10px 16px; border-radius:var(--r-full); min-height:42px;\n  display:inline-flex; align-items:center; gap:7px;\n  transition:all var(--fast) var(--ease);\n}\n.pill:hover{ border-color:var(--ink-4); color:var(--ink); transform:translateY(-1px); }\n.pill:active{ transform:scale(.96); }\n.pill[aria-checked=\"true\"]{\n  background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600;\n  box-shadow:0 6px 18px -6px rgba(16,20,37,.42);\n}\n@media (prefers-color-scheme: dark){\n  .pill[aria-checked=\"true\"]{ background:var(--brand); border-color:var(--brand); color:#fff;\n    box-shadow:0 6px 18px -6px rgba(139,132,255,.55); }\n}\n.pill.inherit{ border-style:dashed; color:var(--ink-3); }\n/* must out-specify .pill.inherit — otherwise the checked pill loses its contrast */\n.pill.inherit[aria-checked=\"true\"]{ border-style:solid; color:var(--bg); }\n@media (prefers-color-scheme: dark){ .pill.inherit[aria-checked=\"true\"]{ color:#fff; } }\n\n/* ── Option: swatch grid ── */\n.swatches{ display:grid; grid-template-columns:repeat(auto-fill,minmax(72px,1fr)); gap:9px; }\n.sw-opt{\n  font-family:inherit; cursor:pointer; background:var(--surface);\n  border:1.5px solid var(--line); border-radius:var(--r-md);\n  padding:11px 5px 9px; display:flex; flex-direction:column; align-items:center; gap:7px;\n  transition:all var(--fast) var(--ease);\n}\n.sw-opt:hover{ border-color:var(--ink-4); transform:translateY(-2px); }\n.sw-opt:active{ transform:scale(.96); }\n.sw-opt .chip{\n  width:30px; height:30px; border-radius:50%; position:relative;\n  box-shadow:inset 0 0 0 1px rgba(0,0,0,.13), 0 2px 5px rgba(16,20,37,.14);\n  transition:transform var(--base) var(--spring);\n}\n.sw-opt .chip::after{\n  content:''; position:absolute; inset:-5px; border-radius:50%;\n  border:2px solid var(--brand); opacity:0; transform:scale(.75);\n  transition:all var(--base) var(--spring);\n}\n.sw-opt[aria-checked=\"true\"]{ border-color:var(--brand); background:var(--brand-tint); }\n.sw-opt[aria-checked=\"true\"] .chip{ transform:scale(1.06); }\n.sw-opt[aria-checked=\"true\"] .chip::after{ opacity:1; transform:scale(1); }\n.sw-opt .nm{ font-size:11.5px; font-weight:600; color:var(--ink-2); letter-spacing:-.01em;\n  text-align:center; line-height:1.25; }\n.sw-opt[aria-checked=\"true\"] .nm{ color:var(--brand); }\n.sw-opt.inherit .chip{\n  background:\n    linear-gradient(135deg,transparent 46%,var(--ink-4) 46%,var(--ink-4) 54%,transparent 54%),\n    var(--surface-2);\n  box-shadow:inset 0 0 0 1.5px var(--line);\n}\n\n/* ── Option: glyph grid ── */\n.glyphs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:9px; }\n.gl-opt{\n  font-family:inherit; cursor:pointer; background:var(--surface);\n  border:1.5px solid var(--line); border-radius:var(--r-md);\n  padding:11px 5px 9px; display:flex; flex-direction:column; align-items:center; gap:6px;\n  color:var(--ink-3); transition:all var(--fast) var(--ease);\n}\n.gl-opt:hover{ border-color:var(--ink-4); color:var(--ink); transform:translateY(-2px); }\n.gl-opt:active{ transform:scale(.96); }\n.gl-opt svg{ display:block; transition:transform var(--base) var(--spring); }\n.gl-opt[aria-checked=\"true\"]{ border-color:var(--brand); background:var(--brand-tint); color:var(--brand); }\n.gl-opt[aria-checked=\"true\"] svg{ transform:scale(1.08); }\n.gl-opt .nm{ font-size:11.5px; font-weight:600; letter-spacing:-.01em; color:var(--ink-2);\n  text-align:center; line-height:1.25; }\n.gl-opt[aria-checked=\"true\"] .nm{ color:var(--brand); }\n.gl-opt.inherit svg{ opacity:.5; }\n.gl-opt.inherit[aria-checked=\"true\"] svg{ opacity:1; }\n.sw-opt.inherit[aria-checked=\"true\"] .chip{ box-shadow:inset 0 0 0 1.5px var(--brand); }\n\n/* ───────────── SUMMARY ───────────── */\n.summary{\n  margin-top:22px; border-radius:var(--r-xl); padding:22px; position:relative; overflow:hidden;\n  background:linear-gradient(150deg, color-mix(in srgb,var(--brand) 7%, var(--surface)) 0%, var(--surface) 62%);\n  border:1px solid var(--brand-tint-2); box-shadow:var(--sh-2);\n}\n.summary::before{\n  content:''; position:absolute; top:-60px; right:-60px; width:200px; height:200px;\n  background:radial-gradient(circle,rgba(139,92,246,.16),transparent 70%); pointer-events:none;\n}\n.sm-hd{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px;\n  position:relative; }\n.sm-kick{ font-size:10px; font-weight:800; letter-spacing:.13em; color:var(--brand); text-transform:uppercase; }\n.sm-stat{ font-size:10.5px; font-weight:700; letter-spacing:.07em; color:var(--ink-4);\n  font-variant-numeric:tabular-nums; }\n.sm-name{\n  font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-size:30px;\n  letter-spacing:-.02em; line-height:1.15; margin-bottom:14px; position:relative;\n}\n.sm-list{ display:flex; flex-direction:column; position:relative; }\n.sm-item{\n  width:100%; display:flex; align-items:center; justify-content:space-between; gap:14px;\n  padding:9px 0; border-bottom:1px solid var(--line-2); font-size:13.5px;\n  font-family:inherit; background:none; border-left:0; border-right:0; border-top:0;\n  cursor:pointer; text-align:left; color:inherit;\n  transition:background var(--fast);\n}\n.sm-item:last-child{ border-bottom:0; }\n.sm-item .k{ color:var(--ink-3); font-weight:500; }\n.sm-item .v{ color:var(--ink); font-weight:700; display:inline-flex; align-items:center; gap:6px;\n  text-align:right; }\n.sm-item .v .sw{ width:12px; height:12px; border-radius:50%;\n  box-shadow:inset 0 0 0 1px rgba(0,0,0,.14); }\n.sm-item .go{ flex:0 0 auto; color:var(--ink-4); opacity:.55; display:grid; place-items:center;\n  transition:opacity var(--fast), color var(--fast), transform var(--fast); }\n.sm-item:hover .go{ opacity:1; color:var(--brand); transform:translateX(2px); }\n.sm-item:hover .k{ color:var(--ink); }\n.sm-item.def .v{ color:var(--ink-4); font-weight:500; font-style:italic; }\n.sm-hint{ margin-top:12px; font-size:11px; color:var(--ink-4); text-align:center;\n  position:relative; letter-spacing:-.003em; }\n.sm-empty{ text-align:center; padding:16px 8px 6px; color:var(--ink-3); font-size:13.5px;\n  line-height:1.6; position:relative; }\n.sm-empty b{ display:block; font-size:26px; margin-bottom:6px; }\n\n/* ───────────── DISCLOSURE ───────────── */\n.legal{ margin-top:18px; border:1px solid var(--line); border-radius:var(--r-lg);\n  background:var(--surface); overflow:hidden; }\n.legal-hd{\n  width:100%; display:flex; align-items:center; gap:10px; padding:13px 16px;\n  background:none; border:none; cursor:pointer; font-family:inherit; text-align:left;\n  color:var(--ink-3); font-size:12.5px; font-weight:500;\n}\n.legal-hd:hover{ color:var(--ink-2); }\n.legal-hd .chev{ margin-left:auto; }\n.legal.open .chev{ transform:rotate(180deg); }\n.legal-bd{ display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--base) var(--ease); }\n.legal.open .legal-bd{ grid-template-rows:1fr; }\n.legal-bd > div{ overflow:hidden; }\n.legal-bd p{ padding:0 16px 15px; font-size:12.5px; line-height:1.65; color:var(--ink-3);\n  letter-spacing:-.003em; }\n.legal-bd strong{ color:var(--ink-2); font-weight:600; }\n.legal-bd a{ color:var(--ink-2); text-decoration:underline; text-underline-offset:2px;\n  text-decoration-color:var(--ink-4); white-space:nowrap; }\n\n.foot{ text-align:center; font-size:11.5px; color:var(--ink-4); padding:22px 0 8px; line-height:1.9; }\n.foot a{ color:var(--ink-3); text-decoration:none; margin:0 7px; }\n.foot a:hover{ color:var(--ink); }\n\n/* ───────────── STICKY CTA ───────────── */\n.dock{\n  position:fixed; left:0; right:0; bottom:0; z-index:70;\n  padding:12px var(--pad) calc(14px + var(--sab));\n  background:linear-gradient(to top, var(--bg) 62%, color-mix(in srgb,var(--bg) 0%, transparent));\n  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);\n}\n.dock-in{ max-width:var(--max); margin:0 auto; }\n.cta{\n  width:100%; min-height:54px; border:none; cursor:pointer; font-family:inherit;\n  border-radius:var(--r-full); font-size:15.5px; font-weight:700; letter-spacing:-.015em;\n  display:flex; align-items:center; justify-content:center; gap:9px; color:#fff;\n  background:var(--ink);\n  box-shadow:0 8px 24px -10px rgba(16,20,37,.55);\n  transition:transform var(--fast) var(--ease), box-shadow var(--base), background var(--slow);\n}\n@media (prefers-color-scheme: dark){ .cta{ background:#2A3048; } }\n.cta:active{ transform:scale(.985); }\n.cta.ready{\n  background:linear-gradient(100deg,var(--brand) 0%,var(--brand-2) 50%,var(--brand-3) 100%);\n  background-size:200% auto; box-shadow:var(--sh-brand);\n  animation:sheen 6s var(--ease) infinite;\n}\n@keyframes sheen{ 0%,100%{ background-position:0% 50%;} 50%{ background-position:100% 50%;} }\n.cta .sub{ font-size:12px; font-weight:600; opacity:.75; }\n\n/* Toast */\n.toast{\n  position:fixed; left:50%; bottom:calc(96px + var(--sab)); transform:translate(-50%,14px);\n  z-index:80; background:var(--ink); color:var(--bg); font-size:13px; font-weight:600;\n  padding:10px 18px; border-radius:var(--r-full); box-shadow:var(--sh-3);\n  opacity:0; pointer-events:none; transition:all var(--base) var(--ease); white-space:nowrap;\n  display:flex; align-items:center; gap:12px;\n}\n@media (prefers-color-scheme: dark){ .toast{ background:#2A3048; color:var(--ink); } }\n.toast.on{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }\n.toast-act{\n  font-family:inherit; font-size:12.5px; font-weight:800; letter-spacing:.02em;\n  color:#B9B4FF; background:none; border:none; cursor:pointer; padding:2px 0;\n  text-transform:uppercase;\n}\n.toast-act:hover{ text-decoration:underline; text-underline-offset:3px; }\n\n@media (prefers-reduced-motion: reduce){\n  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important;\n    transition-duration:.01ms !important; }\n  html{ scroll-behavior:auto; }\n}\n@media (max-width:360px){\n  :root{ --pad:16px; }\n  .swatches{ grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); }\n  .glyphs{ grid-template-columns:repeat(auto-fill,minmax(70px,1fr)); }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\n\u003cdiv class=\"ambient\" aria-hidden=\"true\">\u003ci>\u003c/i>\u003ci>\u003c/i>\u003ci>\u003c/i>\u003c/div>\n\n\u003csvg width=\"0\" height=\"0\" aria-hidden=\"true\" style=\"position:absolute\">\n  \u003cdefs>\n    \u003clinearGradient id=\"ringGrad\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n      \u003cstop offset=\"0%\" stop-color=\"#5B54E8\"/>\u003cstop offset=\"55%\" stop-color=\"#8B5CF6\"/>\n      \u003cstop offset=\"100%\" stop-color=\"#EC4899\"/>\n    \u003c/linearGradient>\n  \u003c/defs>\n\u003c/svg>\n\n\u003c!-- ══ HEADER ══ -->\n\u003cheader class=\"hdr\" id=\"hdr\">\n  \u003cdiv class=\"hdr-in\">\n    \u003cbutton class=\"icon-btn\" id=\"back\" aria-label=\"Go back\">\n      \u003csvg width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M19 12H5\"/>\u003cpath d=\"m12 19-7-7 7-7\"/>\u003c/svg>\n    \u003c/button>\n    \u003cdiv class=\"hdr-mid\">\n      \u003cspan class=\"hdr-kicker\">\u003cspan class=\"pulse\">\u003c/span>Room 1 · Identity · Step 2 of 2\u003c/span>\n      \u003cspan class=\"hdr-title\" id=\"hdrTitle\">Design their face\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"ring\" role=\"progressbar\" aria-valuemin=\"0\" aria-valuemax=\"10\" aria-valuenow=\"0\"\n         aria-label=\"Traits personalised\" id=\"ring\">\n      \u003csvg width=\"40\" height=\"40\" viewBox=\"0 0 40 40\">\n        \u003ccircle class=\"trk\" cx=\"20\" cy=\"20\" r=\"16.5\" fill=\"none\" stroke-width=\"3\"/>\n        \u003ccircle class=\"val\" id=\"ringVal\" cx=\"20\" cy=\"20\" r=\"16.5\" fill=\"none\" stroke-width=\"3\"\n                stroke-dasharray=\"103.67\" stroke-dashoffset=\"103.67\"/>\n      \u003c/svg>\n      \u003cb id=\"ringTxt\">0\u003c/b>\n    \u003c/div>\n  \u003c/div>\n\u003c/header>\n\n\u003cmain class=\"shell\">\n\n  \u003c!-- ══ HERO ══ -->\n  \u003csection class=\"hero\">\n    \u003cdiv class=\"portrait\" id=\"portraitWrap\" data-badge=\"SOURCE\">\n      \u003cdiv class=\"ph\" id=\"portrait\" aria-hidden=\"true\">\n        \u003csvg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/>\u003ccircle cx=\"12\" cy=\"7\" r=\"4\"/>\u003c/svg>\n      \u003c/div>\n    \u003c/div>\n    \u003cp class=\"sketch-cap\" id=\"sketchCap\" hidden>Live sketch — the real render is generated once, at the end.\u003c/p>\n    \u003ch1>Design \u003cspan class=\"nm\" id=\"heroName\">Ray\u003c/span>.\u003c/h1>\n    \u003cp class=\"lede\">Ten traits, all optional. Anything you leave alone is \u003cb>inherited from your photo\u003c/b>.\u003c/p>\n    \u003cdiv class=\"hero-actions\">\n      \u003cbutton class=\"ghost-btn\" id=\"skipAll\">\n        \u003csvg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"m13 17 5-5-5-5\"/>\u003cpath d=\"m6 17 5-5-5-5\"/>\u003c/svg>\n        Skip all — inherit everything\n      \u003c/button>\n    \u003c/div>\n  \u003c/section>\n\n  \u003c!-- ══ LIVE BLUEPRINT STRIP ══ -->\n  \u003cdiv class=\"strip-mount\">\n    \u003cdiv class=\"strip\" id=\"strip\" aria-live=\"polite\">\n      \u003cdiv class=\"strip-in\" id=\"stripIn\">\n        \u003cspan class=\"strip-lbl\">Blueprint\u003c/span>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003c!-- ══ TRAIT SECTIONS ══ -->\n  \u003cdiv class=\"sections\" id=\"sections\">\u003c/div>\n\n  \u003c!-- ══ SUMMARY ══ -->\n  \u003csection class=\"summary\" id=\"summary\">\n    \u003cdiv class=\"sm-hd\">\n      \u003cspan class=\"sm-kick\">The Blueprint\u003c/span>\n      \u003cspan class=\"sm-stat\" id=\"smStat\">DRAFT · 0/10\u003c/span>\n    \u003c/div>\n    \u003cdiv class=\"sm-name\" id=\"smName\">Ray\u003c/div>\n    \u003cdiv class=\"sm-list\" id=\"smList\">\u003c/div>\n  \u003c/section>\n\n  \u003c!-- ══ LEGAL ══ -->\n  \u003cdiv class=\"legal\" id=\"legal\">\n    \u003cbutton class=\"legal-hd\" aria-expanded=\"false\" aria-controls=\"legalBd\" id=\"legalBtn\">\n      \u003csvg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003ccircle cx=\"12\" cy=\"12\" r=\"10\"/>\u003cpath d=\"M12 16v-4\"/>\u003cpath d=\"M12 8h.01\"/>\u003c/svg>\n      Preferences only — not a medical or genetic service\n      \u003csvg class=\"chev\" width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"m6 9 6 6 6-6\"/>\u003c/svg>\n    \u003c/button>\n    \u003cdiv class=\"legal-bd\" id=\"legalBd\">\u003cdiv>\n      \u003cp>These trait selections are \u003cstrong>preferences only\u003c/strong>, recorded as part of your\n      conceptual legacy profile. MySpawn performs no biological, medical, or genetic procedures,\n      and nothing on this page is binding or final. Renders are AI-generated illustrations, not\n      predictions. \u003ca href=\"#\">Read full terms →\u003c/a>\u003c/p>\n    \u003c/div>\u003c/div>\n  \u003c/div>\n\n  \u003cdiv class=\"foot\">\n    \u003ca href=\"#\">Privacy\u003c/a>·\u003ca href=\"#\">Terms\u003c/a>·\u003ca href=\"#\">FAQ\u003c/a>\u003cbr>\n    © 2026 MySpawn Inc.\n  \u003c/div>\n\u003c/main>\n\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\">\u003c/div>\n\n\u003c!-- ══ DOCK ══ -->\n\u003cdiv class=\"dock\">\n  \u003cdiv class=\"dock-in\">\n    \u003cbutton class=\"cta\" id=\"cta\">\n      \u003cspan id=\"ctaTxt\">Continue with photo defaults\u003c/span>\n      \u003csvg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M5 12h14\"/>\u003cpath d=\"m12 5 7 7-7 7\"/>\u003c/svg>\n    \u003c/button>\n  \u003c/div>\n\u003c/div>\n\n\u003cscript>\n'use strict';\n\n/* ═══════════════ 1 · GLYPH LIBRARY ═══════════════ */\nconst S = (d, vb='0 0 40 44') =>\n  `\u003csvg width=\"38\" height=\"40\" viewBox=\"${vb}\" fill=\"none\" stroke=\"currentColor\"\n    stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${d}\u003c/svg>`;\n\n/* Shared brow reference line for the hairline set */\nconst BROW = '\u003cpath d=\"M9 38h22\" stroke-dasharray=\"3 3\" opacity=\".42\"/>';\n\nconst GLYPH = {\n  /* Face shapes — full head outlines */\n  'Oval':      S('\u003cellipse cx=\"20\" cy=\"22\" rx=\"12.5\" ry=\"17\"/>'),\n  'Round':     S('\u003ccircle cx=\"20\" cy=\"22\" r=\"14.5\"/>'),\n  'Square':    S('\u003cpath d=\"M7 15c0-6 3-9 13-9s13 3 13 9v14c0 7-5 10-13 10S7 36 7 29z\"/>'),\n  'Heart':     S('\u003cpath d=\"M6.5 17C6.5 8.5 12 5.5 20 9c8-3.5 13.5-.5 13.5 8 0 12-8.5 22-13.5 25C15 39 6.5 29 6.5 17z\"/>'),\n  'Diamond':   S('\u003cpath d=\"M20 5 33 22 20 39 7 22z\"/>'),\n  'Oblong':    S('\u003cellipse cx=\"20\" cy=\"22\" rx=\"10\" ry=\"18.5\"/>'),\n\n  /* Jawlines — lower-face contours */\n  'Soft':      S('\u003cpath d=\"M6 8v9c0 10 6 16 14 16s14-6 14-16V8\"/>'),\n  'Defined':   S('\u003cpath d=\"M6 8v11c0 5 2 8 6 11l4 3h8l4-3c4-3 6-6 6-11V8\"/>'),\n  'Angular':   S('\u003cpath d=\"M6 8v10l4 10 10 6 10-6 4-10V8\"/>'),\n  'Rounded':   S('\u003cpath d=\"M6 8v6c0 12 6 19 14 19s14-7 14-19V8\"/>'),\n\n  /* Hairlines — silhouette + a fixed dashed brow line. Without the shared\n     baseline, \"Natural\" / \"Receding\" / \"High\" are near-indistinguishable. */\n  'Natural':   S(BROW + '\u003cpath d=\"M5 34V21C5 11 11 5 20 5s15 6 15 16v13\"/>'),\n  'Receding':  S(BROW + '\u003cpath d=\"M5 34V25c0-2 2-3 4-5 2-2 1-7 11-7s9 5 11 7c2 2 4 3 4 5v9\"/>'),\n  \"Widow's Peak\": S(BROW + '\u003cpath d=\"M5 34V21C5 11 11 5 20 5s15 6 15 16v13\"/>\u003cpath d=\"M13.5 7 20 16l6.5-9\"/>'),\n  'High':      S(BROW + '\u003cpath d=\"M5 34V28c0-8 6-13 15-13s15 5 15 13v6\"/>'),\n  'Straight':  S(BROW + '\u003cpath d=\"M5 34V13h30v21\"/>'),\n  'M-Shaped':  S(BROW + '\u003cpath d=\"M5 34V24c0-7 3-11 8-11 4 0 6 3 7 8 1-5 3-8 7-8 5 0 8 4 8 11v10\"/>'),\n\n  /* Noses — profile at three scales */\n  'Small':     S('\u003cpath d=\"M20 14c0 6-2.5 8-2.5 10.5 0 2 5 2 5 0C22.5 22 20 20 20 14z\"/>\u003cpath d=\"M8 38c3-3 7-4.5 12-4.5S29 35 32 38\"/>'),\n  'Medium':    S('\u003cpath d=\"M20 10c0 9-3.5 11.5-3.5 14.5 0 2.6 7 2.6 7 0C23.5 21.5 20 19 20 10z\"/>\u003cpath d=\"M8 38c3-3 7-4.5 12-4.5S29 35 32 38\"/>'),\n  'Large':     S('\u003cpath d=\"M20 6c0 12-4.5 14.5-4.5 18 0 3.2 9 3.2 9 0C24.5 20.5 20 18 20 6z\"/>\u003cpath d=\"M8 38c3-3 7-4.5 12-4.5S29 35 32 38\"/>'),\n\n  /* Hair styles */\n  'Buzz':      S('\u003cpath d=\"M8 21a12 12 0 0 1 24 0v6c0 8-5 12-12 12S8 35 8 27z\"/>\u003cpath d=\"M8.5 18h23\"/>'),\n  'Short':     S('\u003cpath d=\"M8 21a12 12 0 0 1 24 0v6c0 8-5 12-12 12S8 35 8 27z\"/>\u003cpath d=\"M7.5 20c1-9 6-13 12.5-13S31.5 11 32.5 20c-4-2-6-5-12.5-5S11.5 18 7.5 20z\"/>'),\n  'Medium':    S('\u003cpath d=\"M8 21a12 12 0 0 1 24 0v6c0 8-5 12-12 12S8 35 8 27z\"/>\u003cpath d=\"M7 20C7 10 12 6 20 6s13 4 13 14v11M7 20v11\"/>'),\n  'Long':      S('\u003cpath d=\"M9 22a11 11 0 0 1 22 0v5c0 7-4.5 11-11 11S9 34 9 27z\"/>\u003cpath d=\"M6 20C6 10 12 5 20 5s14 5 14 15v19M6 20v19\"/>'),\n  'Curly':     S('\u003cpath d=\"M8 22a12 12 0 0 1 24 0v5c0 8-5 12-12 12S8 35 8 27z\"/>\u003cpath d=\"M6 19c2-3 3-1 5-4s4 1 6-3 4 2 6-1 3 3 5 1 3 4 6 5\"/>'),\n  'Wavy':      S('\u003cpath d=\"M8 22a12 12 0 0 1 24 0v5c0 8-5 12-12 12S8 35 8 27z\"/>\u003cpath d=\"M6 20c3-9 8-13 14-13s11 4 14 13\"/>\u003cpath d=\"M7 24c3 2 6-2 9 0s5-2 8 0 6-2 9 0\"/>'),\n  'Braids':    S('\u003cpath d=\"M10 22a10 10 0 0 1 20 0v5c0 7-4 11-10 11s-10-4-10-11z\"/>\u003cpath d=\"M9 19C9 10 13 6 20 6s11 4 11 13\"/>\u003cpath d=\"M9 22c1 5 0 8 1 13M31 22c-1 5 0 8-1 13\"/>'),\n\n  /* Expressions */\n  'Confident': S('\u003ccircle cx=\"20\" cy=\"21\" r=\"14.5\"/>\u003cpath d=\"M14 18h3M23 18h3\"/>\u003cpath d=\"M15 26c2.5 2.5 8 3 11-2\"/>'),\n  'Calm':      S('\u003ccircle cx=\"20\" cy=\"21\" r=\"14.5\"/>\u003cpath d=\"M13.5 18.5h4M22.5 18.5h4\"/>\u003cpath d=\"M15.5 26c3 1.5 6 1.5 9 0\"/>'),\n  'Intense':   S('\u003ccircle cx=\"20\" cy=\"21\" r=\"14.5\"/>\u003cpath d=\"M13 15.5l4.5 2M27 15.5l-4.5 2\"/>\u003cpath d=\"M14 19h3M23 19h3\"/>\u003cpath d=\"M15.5 27h9\"/>'),\n  'Friendly':  S('\u003ccircle cx=\"20\" cy=\"21\" r=\"14.5\"/>\u003cpath d=\"M14 18h3M23 18h3\"/>\u003cpath d=\"M13.5 24c2 4.5 11 4.5 13 0\"/>'),\n  'Serious':   S('\u003ccircle cx=\"20\" cy=\"21\" r=\"14.5\"/>\u003cpath d=\"M12.5 16h5M22.5 16h5\"/>\u003cpath d=\"M14 19.5h3M23 19.5h3\"/>\u003cpath d=\"M15 27h10\"/>')\n};\n\n/* ═══════════════ 2 · TRAIT MODEL ═══════════════ */\nconst SECTIONS = [\n  { id:'face',  name:'Face',     ico:'\u003cpath d=\"M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20\"/>\u003cpath d=\"M8.5 10h.01M15.5 10h.01\"/>\u003cpath d=\"M9 15.5c1.8 1.6 4.2 1.6 6 0\"/>' },\n  { id:'color', name:'Colouring',ico:'\u003ccircle cx=\"13.5\" cy=\"6.5\" r=\"2.5\"/>\u003ccircle cx=\"17.5\" cy=\"10.5\" r=\"2.5\"/>\u003ccircle cx=\"8.5\" cy=\"7.5\" r=\"2.5\"/>\u003ccircle cx=\"6.5\" cy=\"12.5\" r=\"2.5\"/>\u003cpath d=\"M12 2a10 10 0 0 0 0 20 3 3 0 0 0 0-6 2 2 0 0 1 0-4h1.8a4.2 4.2 0 0 0 4.2-4.2A6.8 6.8 0 0 0 12 2\"/>' },\n  { id:'hair',  name:'Hair',     ico:'\u003cpath d=\"M7 20v-6a5 5 0 0 1 10 0v6\"/>\u003cpath d=\"M3.5 21C3.5 9.5 7 4 12 4s8.5 5.5 8.5 17\"/>\u003cpath d=\"M4.2 12c2.2-1.6 3.4-4 7.8-4s5.6 2.4 7.8 4\"/>' },\n  { id:'vibe',  name:'Presence', ico:'\u003cpath d=\"m13 2-9 12h7l-1 8 9-12h-7z\"/>' }\n];\n\nconst TRAITS = [\n  { id:'race',      s:'face',  label:'Race & Ethnicity', hint:'Ancestral background',\n    ask:'Which genetic background would you like them to carry?', kind:'pill',\n    options:['Asian','Latino','African','Caucasian','Middle Eastern','Mixed Race'] },\n\n  { id:'shape',     s:'face',  label:'Face Shape', hint:'Soft & round or sharp & angular',\n    ask:'The overall silhouette of the head.', kind:'glyph',\n    options:['Oval','Round','Square','Heart','Diamond','Oblong'] },\n\n  { id:'nose',      s:'face',  label:'Nose', hint:'Most people leave this as-is',\n    ask:'Relative size and prominence.', kind:'glyph',\n    options:['Small','Medium','Large'] },\n\n  { id:'jaw',       s:'face',  label:'Jawline', hint:'The line framing the lower face',\n    ask:'How sharply the lower face is defined.', kind:'glyph',\n    options:['Soft','Defined','Angular','Rounded'] },\n\n  { id:'eye',       s:'color', label:'Eye Colour', hint:'Reads strongest in person',\n    ask:'Iris pigment.', kind:'swatch',\n    options:[['Brown','#6B4423'],['Blue','#5B8DC4'],['Green','#4E8A5E'],\n             ['Hazel','#9A7B4F'],['Grey','#8C95A5'],['Amber','#C68A3E']] },\n\n  { id:'skin',      s:'color', label:'Skin Tone', hint:'Shaped by climate & ancestry',\n    ask:'Base complexion.', kind:'swatch',\n    options:[['Fair','#F3DCC6'],['Light','#EDC7A6'],['Medium','#D8A277'],['Olive','#C08E60'],\n             ['Tan','#B0764B'],['Brown','#8A5732'],['Deep','#5C3A22']] },\n\n  { id:'haircolor', s:'hair',  label:'Hair Colour', hint:'Natural pigment',\n    ask:'Their natural hair colour.', kind:'swatch',\n    options:[['Black','#1B1917'],['Brown','#5A3825'],['Blonde','#D8B27F'],\n             ['Red','#A64B2A'],['Grey','#9AA1AE'],['White','#E7E5E2']] },\n\n  { id:'hairstyle', s:'hair',  label:'Hair Style', hint:'How they wear it',\n    ask:'Length and texture.', kind:'glyph',\n    options:['Buzz','Short','Medium','Long','Curly','Wavy','Braids'] },\n\n  { id:'hairline',  s:'hair',  label:'Hairline', hint:'The shape at the forehead',\n    ask:'Where the hair meets the brow.', kind:'glyph',\n    options:['Natural','Receding',\"Widow's Peak\",'High','Straight','M-Shaped'] },\n\n  { id:'expression',s:'vibe',  label:'Default Expression', hint:'How the world reads them',\n    ask:'Their resting look.', kind:'glyph',\n    options:['Confident','Calm','Intense','Friendly','Serious'] }\n];\n\nconst TOTAL = TRAITS.length;\nconst byId  = id => TRAITS.find(t => t.id === id);\nconst optName  = o => Array.isArray(o) ? o[0] : o;\nconst optColor = o => Array.isArray(o) ? o[1] : null;\n\n/* Short trait keys for the blueprint stamps — \"Brown\" alone is ambiguous\n   (eye? hair? skin?), so every stamp carries its trait. */\nconst SHORT = { race:'Race', shape:'Face', nose:'Nose', jaw:'Jaw', eye:'Eyes',\n  skin:'Skin', haircolor:'Hair', hairstyle:'Style', hairline:'Hairline', expression:'Look' };\n\nconst MILESTONES = [\n  '', 'One down. Nice start.', 'Two locked in.', 'Three — taking shape.',\n  'Four. Feels real now.', 'Halfway there.', 'Six. Dialled in.',\n  'Seven. Almost there.', 'Eight. Sharp.', 'Nine — one to go.',\n  'All ten. Fully sealed.'\n];\n\n/* ═══════════════ 3 · STATE ═══════════════ */\nconst state = { picks:{}, openRow:null };\nconst setCount = () => Object.keys(state.picks).length;\n\n/* Draft persistence — an interrupted session should not cost the visitor\n   their choices. Values are validated against the trait model on restore. */\nconst STORE = 'myspawn.blueprint.v1';\nfunction saveDraft() {\n  try { localStorage.setItem(STORE, JSON.stringify(state.picks)); } catch (_) {}\n}\nfunction loadDraft() {\n  try {\n    const raw = JSON.parse(localStorage.getItem(STORE) || '{}');\n    const clean = {};\n    for (const [id, v] of Object.entries(raw)) {\n      const t = byId(id);\n      if (t && t.options.some(o => optName(o) === v)) clean[id] = v;\n    }\n    return clean;\n  } catch (_) { return {}; }\n}\n\n/* Name from ?name= — sanitised, never injected as HTML */\nlet NAME = 'Ray', hasName = true;\n(() => {\n  const raw = new URLSearchParams((window.__fbdSearch || location.search)).get('name');\n  const clean = (raw || '').trim().replace(/[\u003c>\"'&\\\\/]/g, '').slice(0, 24);\n  if (clean) { NAME = clean; }\n  else if (raw !== null) { NAME = 'your descendant'; hasName = false; }\n  document.getElementById('heroName').textContent = NAME;\n  document.getElementById('smName').textContent = hasName ? NAME : 'Unnamed Blueprint';\n})();\n\n/* Photo from ?photo= — same-origin/data/https only */\nlet PHOTO = null;\n(() => {\n  const src = new URLSearchParams((window.__fbdSearch || location.search)).get('photo');\n  if (!src || !/^(https:\\/\\/|data:image\\/|\\/)/i.test(src)) return;\n  const img = new Image();\n  img.onload = () => { img.alt = 'Your source photo'; PHOTO = img; updatePortrait(); };\n  img.src = src;\n})();\n\n/* ═══════════════ 3b · LIVE SKETCH ═══════════════\n   A deterministic line-art portrait, drawn from the current picks — the same\n   visual language as the body designer's live figure. It answers \"is my\n   choice registering?\" instantly and for free; the photoreal render is\n   generated ONCE at the end of the flow instead of on every tap.\n   Race is deliberately never depicted — only explicit colour picks are. */\nconst HEAD = {   // half-widths/heights around cx=100\n  Oval:    { crownY:36, top:52, cheek:55, jawW:38, chinW:16, chinY:182 },\n  Round:   { crownY:44, top:58, cheek:62, jawW:48, chinW:26, chinY:172 },\n  Square:  { crownY:42, top:55, cheek:56, jawW:50, chinW:34, chinY:176 },\n  Heart:   { crownY:40, top:60, cheek:56, jawW:31, chinW:9,  chinY:180 },\n  Diamond: { crownY:46, top:42, cheek:58, jawW:31, chinW:11, chinY:182 },\n  Oblong:  { crownY:30, top:48, cheek:50, jawW:36, chinW:16, chinY:194 }\n};\nconst JAW_MOD = {   // subtle: jaw pick reshapes the lower face\n  Soft:    { jaw:-2, chin:+3 },\n  Defined: { jaw:+4, chin:+1 },\n  Angular: { jaw:+7, chin:+4 },\n  Rounded: { jaw:-1, chin:+6 }\n};\nconst NOSE_LEN = { Small:24, Medium:32, Large:41 };\nconst NOSE_W   = { Small:6.5, Medium:8.5, Large:10.5 };\n\nfunction headGeom(picks) {\n  const g = { ...(HEAD[picks.shape] || HEAD.Oval) };\n  const j = JAW_MOD[picks.jaw];\n  if (j) { g.jawW += j.jaw; g.chinW += j.chin; }\n  return g;\n}\n\nfunction headPath(g) {\n  const { crownY, top, cheek, jawW, chinW, chinY } = g;\n  const R = ''\n    + `M100 ${crownY}`\n    + `C${100+top*0.62} ${crownY} ${100+top} ${crownY+22} ${100+top} ${crownY+42}`\n    + `C${100+cheek} ${crownY+62} ${100+cheek} 108 ${100+cheek} 124`\n    + `C${100+cheek} 142 ${100+jawW+4} ${chinY-26} ${100+jawW} ${chinY-18}`\n    + `C${100+jawW-6} ${chinY-8} ${100+chinW+8} ${chinY} ${100+chinW} ${chinY}`\n    + `Q100 ${chinY+5} ${100-chinW} ${chinY}`\n    + `C${100-chinW-8} ${chinY} ${100-jawW+6} ${chinY-8} ${100-jawW} ${chinY-18}`\n    + `C${100-jawW-4} ${chinY-26} ${100-cheek} 142 ${100-cheek} 124`\n    + `C${100-cheek} 108 ${100-cheek} ${crownY+62} ${100-top} ${crownY+42}`\n    + `C${100-top} ${crownY+22} ${100-top*0.62} ${crownY} 100 ${crownY}Z`;\n  return R;\n}\n\n/* Inner hair edge across the forehead, right temple → left temple */\nfunction hairlineEdge(kind, xr, xl, y) {\n  switch (kind) {\n    case 'High':          y -= 10; return `L${xr} ${y}Q100 ${y+8} ${xl} ${y}`;\n    case 'Straight':      return `L${xr} ${y}L${xl} ${y}`;\n    case \"Widow's Peak\":  return `L${xr} ${y}Q${(xr+100)/2} ${y+2} 100 ${y+11}Q${(xl+100)/2} ${y+2} ${xl} ${y}`;\n    case 'Receding':      return `L${xr} ${y-12}C${xr-10} ${y-12} ${xr-14} ${y+5} ${100+12} ${y+5}`\n                               + `L${100-12} ${y+5}C${xl+14} ${y+5} ${xl+10} ${y-12} ${xl} ${y-12}`;\n    case 'M-Shaped':      return `L${xr} ${y-6}Q${(xr+100)/2} ${y+9} 100 ${y-2}Q${(xl+100)/2} ${y+9} ${xl} ${y-6}`;\n    default:              return `L${xr} ${y}Q100 ${y+9} ${xl} ${y}`;   // Natural\n  }\n}\n\nfunction hairSvg(picks, g, hairFill) {\n  const style = picks.hairstyle || ((picks.haircolor || picks.hairline) ? 'Short' : null);\n  if (!style) return '';\n  const off = { Buzz:4, Short:9, Medium:12, Long:13, Curly:13, Wavy:12, Braids:9 }[style] || 9;\n  const sideY = { Buzz:96, Short:102, Medium:138, Long:150, Curly:112, Wavy:112, Braids:104 }[style] || 102;\n  const crown = g.crownY - off, wTop = g.top + off, wSide = g.cheek + off - 2;\n  const hlY = 82, xr = g.top - 9, xl = -(g.top - 9);\n  const fillAttr = hairFill\n    ? `fill=\"${hairFill}\" fill-opacity=\"${style === 'Buzz' ? .5 : .92}\"`\n    : `fill=\"var(--surface-2)\"`;\n  let d = `M${100-wSide} ${sideY}`\n    + `C${100-wSide} ${crown+34} ${100-wTop*0.8} ${crown} 100 ${crown}`\n    + `C${100+wTop*0.8} ${crown} ${100+wSide} ${crown+34} ${100+wSide} ${sideY}`\n    + `L${100+g.cheek-3} ${sideY}`\n    + `C${100+g.cheek-2} ${hlY+22} ${100+g.top-2} ${hlY+16} ${100+xr} ${hlY}`;\n  d += hairlineEdge(picks.hairline, 100+xr, 100+xl, hlY);\n  d += `C${100-g.top+2} ${hlY+16} ${100-g.cheek+2} ${hlY+22} ${100-g.cheek+3} ${sideY}Z`;\n  let extra = '';\n  if (style === 'Curly')\n    extra = `\u003cpath d=\"M${100-wSide+6} ${crown+40}q7-9 14-2m8-8q7-8 14-1m8-7q7-6 13 1\" fill=\"none\" opacity=\".55\"/>`;\n  if (style === 'Wavy')\n    extra = `\u003cpath d=\"M${100-wSide+5} ${crown+42}c8-6 14 3 22-3s13 4 21-2 13 3 20-2\" fill=\"none\" opacity=\".55\"/>`;\n  if (style === 'Long')\n    extra = `\u003cpath d=\"M${100-wSide} ${sideY-40}C${100-wSide-3} ${sideY+28} ${100-wSide+2} ${sideY+52} ${100-wSide+7} ${sideY+58}\n             M${100+wSide} ${sideY-40}C${100+wSide+3} ${sideY+28} ${100+wSide-2} ${sideY+52} ${100+wSide-7} ${sideY+58}\" fill=\"none\" opacity=\".7\"/>`;\n  if (style === 'Braids') {\n    const bw = 9, xL = 100 - g.cheek - 3, xR = 100 + g.cheek + 3;\n    const braid = x =>\n      `\u003crect x=\"${x-bw/2}\" y=\"${sideY}\" width=\"${bw}\" height=\"72\" rx=\"${bw/2}\" ${fillAttr}/>` +\n      [18, 36, 54].map(dy => `\u003cpath d=\"M${x-bw/2} ${sideY+dy}l${bw} 9M${x+bw/2} ${sideY+dy}l-${bw} 9\" fill=\"none\" opacity=\".6\"/>`).join('');\n    extra = braid(xL) + braid(xR);\n  }\n  return `\u003cg ${fillAttr} stroke=\"currentColor\" stroke-width=\"3\">` + `\u003cpath d=\"${d}\"/>` + extra + `\u003c/g>`;\n}\n\nfunction featureSvg(picks, g, eyeHex) {\n  const exp = picks.expression || 'Calm';\n  const eyeY = 112, off = 26;\n  let s = '';\n  // brows\n  const brow = {\n    Confident: `M${100-off-12} 98q12-6 24-2M${100+off-12} 96q12-4 24 2`,\n    Calm:      `M${100-off-12} 97q12-5 24-1M${100+off-12} 96q12-4 24 1`,\n    Intense:   `M${100-off-13} 93l25 6M${100+off+13} 93l-25 6`,\n    Friendly:  `M${100-off-12} 95q12-8 24-3M${100+off-12} 92q12-5 24 3`,\n    Serious:   `M${100-off-13} 97h26M${100+off-13} 97h26`\n  }[exp];\n  s += `\u003cpath d=\"${brow}\" fill=\"none\" stroke-width=\"3.4\"/>`;\n  // eyes\n  for (const sx of [-1, 1]) {\n    const cx = 100 + sx*off;\n    s += `\u003cellipse cx=\"${cx}\" cy=\"${eyeY}\" rx=\"11\" ry=\"6.4\" fill=\"var(--surface)\" stroke-width=\"2.6\"/>`\n       + `\u003ccircle cx=\"${cx}\" cy=\"${eyeY}\" r=\"4.6\" fill=\"${eyeHex || 'var(--ink-4)'}\" stroke=\"none\"/>`\n       + `\u003ccircle cx=\"${cx}\" cy=\"${eyeY}\" r=\"1.9\" fill=\"var(--ink)\" stroke=\"none\"/>`;\n  }\n  // nose\n  const L = NOSE_LEN[picks.nose] || 30, w = NOSE_W[picks.nose] || 7.5;\n  s += `\u003cpath d=\"M100 ${eyeY+4}c0 ${L*0.55} -${w} ${L*0.72} -${w} ${L*0.86}c0 ${w*0.9} ${2*w} ${w*0.9} ${2*w} 0C${100+w} ${eyeY+4+L*0.72} 100 ${eyeY+4+L*0.55} 100 ${eyeY+4}\" fill=\"none\" stroke-width=\"2.6\"/>`;\n  // mouth\n  const mY n\nconst VISUAL = ['shape','jaw','nose','eye','skin','haircolor','hairstyle','hairline','expression'];\nfunction updatePortrait() {\n  const wrap = document.getElementById('portraitWrap');\n  const slot = document.getElementById('portrait');\n  const live = VISUAL.some(k => k in state.picks);\n  wrap.dataset.badge = live ? 'LIVE SKETCH' : 'SOURCE';\n  document.getElementById('sketchCap').hidden = !live;\n  if (live) {\n    slot.className = 'sketch';\n    slot.innerHTML = renderFace(state.picks);\n  } else if (PHOTO) {\n    slot.className = 'ph';\n    slot.textContent = '';\n    slot.appendChild(PHOTO);\n  } else {\n    slot.className = 'ph';\n    slot.innerHTML = '\u003csvg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2\"/>\u003ccircle cx=\"12\" cy=\"7\" r=\"4\"/>\u003c/svg>';\n  }\n}\n\n/* ═══════════════ 4 · BUILD DOM ═══════════════ */\nconst CHECK = '\u003csvg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"M20 6 9 17l-5-5\"/>\u003c/svg>';\nconst CHEV  = '\u003csvg class=\"chev\" width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"m6 9 6 6 6-6\"/>\u003c/svg>';\n\nfunction buildOption(trait, opt) {\n  const name = optName(opt), color = optColor(opt);\n  const btn = document.createElement('button');\n  btn.type = 'button';\n  btn.setAttribute('role', 'radio');\n  btn.setAttribute('aria-checked', 'false');\n  btn.dataset.value = name;\n\n  if (trait.kind === 'swatch') {\n    btn.className = 'sw-opt';\n    btn.innerHTML =\n      `\u003cspan class=\"chip\" style=\"background:${color}\">\u003c/span>\u003cspan class=\"nm\">\u003c/span>`;\n    btn.querySelector('.nm').textContent = name; n\n/* ═══════════════ 5 · INTERACTION ═══════════════ */\n/* Last input modality — programmatic focus should follow keyboards, not taps */\nlet kbdModality = false;\naddEventListener('keydown', () => { kbdModality = true; }, true);\naddEventListener('pointerdown', () => { kbdModality = false; }, true);\n\nfunction toggleRow(id, force, silent) {\n  const open = force !== undefined ? force : state.openRow !== id;\n  // Another panel collapsing above us keeps the target moving for one transition.\n  const collapsing = state.openRow && state.openRow !== id;\n\n  if (collapsing) {\n    const prev = document.getElementById('row-' + state.openRow);\n    prev.classList.remove('open');\n    prev.querySelector('.row-hd').setAttribute('aria-expanded', 'false');\n  }\n  const row = document.getElementById('row-' + id);\n  row.classList.toggle('open', open);\n  row.querySelector('.row-hd').setAttribute('aria-expanded', String(open));\n  state.openRow = open ? id : null;\n  if (!open || silent) return;\n  if (collapsing) setTimeout(() => scrollRowIntoView(row), 300); // wait it out\n  else scrollRowIntoView(row);\n}\n\n/* Measure against the LIVE sticky heights — the strip grows 0→58px on the\n   first pick, and a hardcoded offset parks the row's options under the chrome. */\nfunction stickyOffset() {\n  const strip = document.getElementById('strip');\n  return document.querySelector('.hdr').offsetHeight +\n         (strip.classList.contains('on') ? strip.offsetHeight : 0) + 12;\n}\n\nfunction scrollRowIntoView(row) {\n  const y = row.getBoundingClientRect().top + window.pageYOffset - stickyOffset();\n  window.scrollTo({ top:Math.max(0, y),\n    behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });\n}\n\nfunction choose(traitId, value) {\n  const before = setCount();\n  if (value === null) delete state.picks[traitId];\n  else state.picks[traitId] = value;\n\n  buzz(value === null ? 4 : 9);\n  paintRow(traitId);\n  paintAll();\n  saveDraft();\n\n  if (setCount() > before) toast(MILESTONES[setCount()] || '');\n\n  /* Auto-advance. Order matters: collapse THIS row first and let the layout\n     settle, then open the next one. Measuring while the outgoing panel is\n     still shrinking (and while the strip is expanding) yields a stale target\n     and drops the new options under the sticky chrome. */\n  const nxt = nextUnset(traitId);\n  toggleRow(traitId, false);\n  setTimeout(() => {\n    if (nxt) {\n      toggleRow(nxt, true);\n      /* Keyboard users land on the next question instead of a collapsed panel.\n         Pointer users keep their un-ringed view — modality decides. */\n      if (kbdModality)\n        document.querySelector('#row-' + nxt + ' .row-hd').focus({ preventScroll:true });\n    }\n    else document.getElementById('summary')\n           .scrollIntoView({ behavior:'smooth', block:'center' });\n  }, 300);\n}\n\nfunction nextUnset(fromId) {\n  const i = TRAITS.findIndex(t => t.id === fromId);\n  for (let k = i + 1; k \u003c TRAITS.length; k++)\n    if (!(TRAITS[k].id in state.picks)) return TRAITS[k].id;\n  for (let k = 0; k \u003c i; k++)\n    if (!(TRAITS[k].id in state.picks)) return TRAITS[k].id;\n  return null;\n}\n\nfunction paintRow(traitId) {\n  const trait = byId(traitId);\n  const row   = document.getElementById('row-' + traitId);\n  const val   = state.picks[traitId] ?? null;\n\n  row.classList.toggle('set', val !== null);\n  row.querySelectorAll('[role=\"radio\"]').forEach(b => {\n    const checked = (b.dataset.value || null) === val;\n    b.setAttribute('aria-checked', String(checked));\n    b.tabIndex = checked ? 0 : -1;   // roving tabindex: one stop per group\n  });\n\n  const slot = row.querySelector('[data-val]');\n  slot.textContent = '';\n  if (val !== null) {\n    const c = colorFor(trait, val);\n    if (c) {\n      const sw = document.createElement('i');\n      sw.className = 'sw'; sw.style.background = c;\n      slot.appendChild(sw);\n    }\n    const s = document.create (d); }\n    const s = document.createElement('span'); s.textContent = v; chip.appendChild(s);\n    chip.addEventListener('click', () => toggleRow(t.id, true));\n    inner.appendChild(chip);\n  });\n\n  // Summary\n  const list = document.getElementById('smList');\n  list.textContent = '';\n  document.getElementById('smStat').textContent =\n    n === TOTAL ? `SEALED · ${TOTAL}/${TOTAL}` : `DRAFT · ${n}/${TOTAL}`;\n\n  if (n === 0) {\n    const e = document.createElement('div');\n    e.className = 'sm-empty';\n    e.innerHTML = '\u003cb>✦\u003c/b>Nothing customised yet.\u003cbr>Every trait will be inherited from your photo — which is a perfectly good answer.';\n    list.appendChild(e);\n  } else {\n    TRAITS.forEach(t => {\n      const v = state.picks[t.id] ?? null;\n      const row = document.createElement('button');\n      row.type = 'button';\n      row.className = 'sm-item' + (v === null ? ' def' : '');\n      row.setAttribute('aria-label', `Edit ${t.label}`);\n      const k = document.createElement('span'); k.className = 'k'; k.textContent = t.label;\n      const val = document.createElement('span'); val.className = 'v';\n      const c = v !== null ? colorFor(t, v) : null;\n      if (c) { const d = document.createElement('i'); d.className = 'sw';\n               d.style.background = c; val.appendChild(d); }\n      const s = document.createElement('span');\n      s.textContent = v === null ? 'From photo' : v;\n      val.appendChild(s);\n      const go = document.createElement('span');\n      go.className = 'go'; go.setAttribute('aria-hidden', 'true');\n      go.innerHTML = '\u003csvg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\u003cpath d=\"m9 18 6-6-6-6\"/>\u003c/svg>';\n      row.append(k, val, go);\n      row.addEventListener('click', () => toggleRow(t.id, true));\n      list.appendChild(row);\n    });\n    const hint = document.createElement('p');\n    hint.className = 'sm-hint';\n    hint.textContent = 'Tap any line to change it.';\n    list.appendChild(hint);\n  }\n\n  // CTA — honest about state\n  const cta = document.getElementById('cta');\n  cta.classList.toggle('ready', n > 0);\n  document.getElementById('ctaTxt').textContent =\n    n === 0 ? 'Continue with photo defaults'\n    : n === TOTAL ? 'Lock in all 10 — see the render'\n    : `Continue — ${n} trait${n > 1 ? 's' : ''} set`;\n}\n\n/* ═══════════════ 6 · FEEDBACK ═══════════════ */\nlet toastTimer;\nfunction toast(msg, action) {\n  if (!msg) return;\n  const el = document.getElementById('toast');\n  el.textContent = msg;\n  if (action) {\n    const b = document.createElement('button');\n    b.type = 'button';\n    b.className = 'toast-act';\n    b.textContent = action.label;\n    b.addEventListener('click', () => { el.classList.remove('on'); action.fn(); });\n    el.appendChild(b);\n  }\n  el.classList.add('on');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(() => el.classList.remove('on'), action ? 5200 : 1900);\n}\nconst buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (_) {} };\n\n/* ═══════════════ 7 · WIRING ═══════════════ */\ndocument.getElementById('skipAll').addEventListener('click', () => {\n  const undo = { ...state.picks };\n  const hadPicks = setCount() > 0;\n  state.picks = {};\n  TRAITS.forEach(t => paintRow(t.id));\n  if (state.openRow) toggleRow(state.openRow, false);\n  paintAll();\n  saveDraft();\n  if (hadPicks) {\n    /* Wiping real choices deserves a way back */\n    toast('All traits reset to your photo', { label:'Undo', fn:() => {\n      state.picks = undo;\n      TRAITS.forEach(t => paintRow(t.id));\n      paintAll();\n      saveDraft();\n      toast(`Restored ${setCount()} trait${setCount() > 1 ? 's' : ''}`);\n    }});\n  } else {\n    toast('All traits inherited from your photo');\n  }\n  document.getElementById('summary').scrollIntoView({ behavior:'smooth', block:'center' });\n});\n\n/* Inside the combined flow (fbd) the parent shell owns step navigation */\nconst EMBEDDED = window.parent !== window;\ndocument.getElementById('back').addEventListener('click', () => {\n  if (EMBEDDED) parent.postMessage({ fbd:'back', from:'face' }, '*');\n  else history.back();\n});\n\ndocument.getElementById('cta').addEventListener('click', () => {\n  buzz(14);\n  toast(setCount() === 0 ? 'Continuing with photo defaults…'\n                         : `Blueprint saved · ${setCount()}/${TOTAL} traits`);\n  if (EMBEDDED) setTimeout(() => parent.postMessage({ fbd:'next', from:'face' }, '*'), 650);\n  // → standalone hand off: location.href = '/room-1/render?traits=' + encodeURIComponent(JSON.stringify(state.picks))\n});\n\nconst legal = document.getElementById('legal');\ndocument.getElementById('legalBtn').addEventListener('click', e => {\n  const open = !legal.classList.contains('open');\n  legal.classList.toggle('open', open);\n  e.currentTarget.setAttribute('aria-expanded', String(open));\n});\n\n/* Header hairline on scroll */\nconst hdr = document.getElementById('hdr');\nlet ticking = false;\naddEventListener('scroll', () => {\n  if (ticking) return;\n  ticking = true;\n  requestAnimationFrame(() => { hdr.classList.toggle('stuck', scrollY > 6); ticking = false; });\n}, { passive:true });\n\n/* Keyboard: arrows move within a radiogroup, Esc collapses */\naddEventListener('keydown', e => {\n  if (e.key === 'Escape' && state.openRow) { toggleRow(state.openRow, false); return; }\n  if (!['ArrowRight','ArrowLeft','ArrowDown','ArrowUp'].includes(e.key)) return;\n  const group = e.target.closest?.('[role=\"radiogroup\"]');\n  if (!group) return;\n  e.preventDefault();\n  const items = [...group.querySelectorAll('[role=\"radio\"]')];\n  const i = items.indexOf(e.target);\n  const step = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1;\n  const next = items[(i + step + items.length) % items.length];\n  items.forEach(b => b.tabIndex = -1);   // tab stop follows focus\n  next.tabIndex = 0;\n  next.focus();\n});\n\n/* Boot — restore an interrupted draft before first paint */\nconst draft = loadDraft();\nif (Object.keys(draft).length) state.picks = draft;\nTRAITS.forEach(t => paintRow(t.id));\npaintAll();\nif (setCount() > 0)\n  toast(`Welcome back — ${setCount()} trait${setCount() > 1 ? 's' : ''} restored`);\nconst firstUnset = TRAITS.find(t => !(t.id in state.picks));\nif (firstUnset)\n  toggleRow(firstUnset.id, true, /* silent */ true); // first unanswered trait pre-opened, no scroll jump\n\u003c/script>\n\u003c/body>\n\u003c/html>\n",
  body: "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n\u003cmeta charset=\"UTF-8\" />\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\" />\n\u003cmeta name=\"theme-color\" content=\"#0B0D14\" />\n\u003cmeta name=\"color-scheme\" content=\"dark\" />\n\u003ctitle>MySpawn — Shape Their Body\u003c/title>\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap\" rel=\"stylesheet\">\n\u003cstyle>\n/* ═══════════════════════════════════════════════════════════\n   MySpawn — Body Designer 1.11\n   Shares the token system with the Identity (face) designer.\n   ═══════════════════════════════════════════════════════════ */\n*,*::before,*::after{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }\n\n:root{\n  --ink:#F3F4FB; --ink-2:#C7CBDE; --ink-3:#959CBA; --ink-4:#6B7396;\n  --bg:#0B0D14; --surface:rgba(24,28,42,.72); --surface-2:#1A1D2B;\n  --line:#262B3D; --line-2:#1E2231;\n  --brand:#8B84FF; --brand-2:#A78BFA; --brand-3:#F472B6;\n  --brand-tint:rgba(139,132,255,.10); --brand-tint-2:rgba(139,132,255,.22);\n\n  /* the loadout is a deliberately different surface — \"equipment\", not \"form\" */\n  --gear:#11151F; --gear-2:#181D2C; --gear-line:#272E45;\n  --gear-ink:#EEF0FA; --gear-ink-2:#98A0C0;\n\n  --r-sm:12px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:999px;\n  --sh-1:0 1px 2px rgba(0,0,0,.34);\n  --sh-2:0 2px 8px -2px rgba(0,0,0,.42), 0 8px 24px -12px rgba(0,0,0,.5);\n  --sh-3:0 8px 32px -12px rgba(0,0,0,.6);\n  --sh-brand:0 8px 28px -10px rgba(91,84,232,.5);\n  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.4,.5,1);\n  --fast:.16s; --base:.28s; --slow:.44s;\n  --fig-bg:#161A27; --fig-ink:#AEB6D4;\n  --pad:20px; --max:560px; --header-h:60px; --sab:env(safe-area-inset-bottom, 0px);\n}\n\nhtml{ -webkit-text-size-adjust:100%; scroll-behavior:smooth; }\nbody{\n  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.5;\n  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;\n  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;\n  overscroll-behavior-y:none; overflow-x:hidden; min-height:100dvh;\n  padding-bottom:calc(120px + var(--sab));\n}\n.ambient{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }\n.ambient i{ position:absolute; border-radius:50%; display:block; }\n.ambient i:nth-child(1){ top:-220px; left:-140px; width:460px; height:460px;\n  background:radial-gradient(circle,rgba(139,92,246,.16),transparent 68%); }\n.ambient i:nth-child(2){ top:220px; right:-200px; width:480px; height:480px;\n  background:radial-gradient(circle,rgba(91,84,232,.13),transparent 68%); }\n.ambient i:nth-child(3){ bottom:-180px; left:-100px; width:400px; height:400px;\n  background:radial-gradient(circle,rgba(236,72,153,.09),transparent 68%); }\n.shell{ position:relative; z-index:1; max-width:var(--max); margin:0 auto; padding:0 var(--pad); }\n\n.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }\n:focus-visible{ outline:2.5px solid var(--brand); outline-offset:3px; border-radius:6px; }\n:focus:not(:focus-visible){ outline:none; }\n\n/* ───────── HEADER ───────── */\n.hdr{\n  position:sticky; top:0; z-index:60; height:var(--header-h);\n  background:color-mix(in srgb, var(--bg) 94%, transparent);\n  backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%);\n  border-bottom:1px solid transparent; transition:border-color var(--base) var(--ease);\n}\n.hdr.stuck{ border-bottom-color:var(--line); }\n.hdr-in{ max-width:var(--max); margin:0 auto; height:100%; padding:0 var(--pad);\n  display:flex; align-items:center; gap:12px; }\n.icon-btn{ width:40px; height:40px; flex:0 0 auto; display:grid; place-items:center;\n  border:none; background:transparent; color:var(--ink-2); cursor:pointer;\n  border-radius:var(--r-full); transition:background var(--fast), color var(--fast); }\n.icon-btn:hover{ background:var(--surface-2); color:var(--ink); }\n.icon-btn:active{ transform:scale(.94); }\n.hdr-mid{ flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }\n.hdr-kicker{ font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;\n  color:var(--brand); display:flex; align-items:center; gap:6px; }\n.pulse{ width:5px; height:5px; border-radius:50%; background:var(--brand);\n  animation:pulse 2.4s var(--ease) infinite; flex:0 0 auto; }\n@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(91,84,232,.45);} 55%{ box-shadow:0 0 0 6px rgba(91,84,232,0);} }\n.hdr-title{ font-size:14px; font-weight:600; letter-spacing:-.01em; color:var(--ink);\n  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }\n.ring{ position:relative; width:44px; height:44px; flex:0 0 auto; }\n.ring > svg{ transform:rotate(-90deg); display:block; }\n.ring .trk{ stroke:var(--line); }\n.ring .val{ stroke:url(#rg); stroke-linecap:round; transition:stroke-dashoffset var(--slow) var(--ease); }\n.ring .mini{ position:absolute; inset:5px; border-radius:50%; overflow:hidden; background:var(--fig-bg); }\n\n/* ───────── FIGURE ───────── */\n.figure{ display:block; overflow:hidden; width:100%; height:100%;\n  background:var(--fig-bg); color:var(--fig-ink); }\n.figure svg{ width:100%; height:100%; display:block; }\n.figure.beat{ animation:beat .42s var(--spring); }\n@keyframes beat{ 0%{transform:scale(1)} 42%{transform:scale(1.035)} 100%{transform:scale(1)} }\n\n/* ───────── HERO ───────── */\n.hero{ padding:24px 0 4px; text-align:center; }\n.stage{\n  width:184px; height:250px; margin:0 auto 8px; position:relative;\n  border-radius:34px; padding:3px;\n  background:linear-gradient(140deg,var(--brand),var(--brand-2) 55%,var(--brand-3));\n  box-shadow:var(--sh-3);\n}\n.stage .figure{ border-radius:31px; color:var(--ink-2); }\n.stage .tick{\n  position:absolute; right:-11px; top:14px; bottom:14px; width:2px;\n  background:linear-gradient(var(--brand-tint-2), var(--brand-tint-2)); border-radius:2px;\n}\n.stage .tick b{\n  position:absolute; right:6px; top:50%; transform:translateY(-50%) rotate(90deg);\n  transform-origin:right center; font-size:9.5px; font-weight:800; letter-spacing:.1em;\n  color:var(--ink-4); white-space:nowrap;\n}\n.hero-cap{ font-size:11.5px; font-weight:600; color:var(--ink-4); margin:10px 0 16px; }\nh1{ font-size:clamp(1.9rem,8vw,2.6rem); font-weight:800; letter-spacing:-.045em;\n  line-height:1.03; margin-bottom:12px; }\nh1 .nm{ font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-weight:400;\n  letter-spacing:-.015em;\n  background:linear-gradient(120deg,var(--brand) 0%,var(--brand-2) 48%,var(--brand-3) 100%);\n  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }\n.lede{ font-size:15px; color:var(--ink-3); max-width:340px; margin:0 auto 18px;\n  letter-spacing:-.008em; line-height:1.55; }\n.lede b{ color:var(--ink-2); font-weight:600; }\n.ghost-btn{ font-family:inherit; font-size:13px; font-weight:600; color:var(--ink-3);\n  background:var(--surface); border:1px solid var(--line); cursor:pointer;\n  padding:9px 16px; border-radius:var(--r-full); display:inline-flex; align-items:center; gap:7px;\n  transition:all var(--fast) var(--ease); box-shadow:var(--sh-1); }\n.ghost-btn:hover{ color:var(--ink); border-color:var(--ink-4); transform:translateY(-1px); }\n.ghost-btn:active{ transform:scale(.97); }\n\n/* ───────── SECTIONS ───────── */\n.sections{ margin-top:24px; display:flex; flex-direction:column; gap:14px; }\n.sect{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-xl);\n  box-shadow:var(--sh-2); overflow:hidden; transition:border-color var(--base) var(--ease); }\n.sect{ backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }\n.sect.complete{ border-color:var(--brand-tint-2); }\n.sect-hd{ display:flex; align-items:center; gap:11px; padding:15px 18px 13px;\n  border-bottom:1px solid var(--line-2); }\n.sect-ico{ width:30px; height:30px; flex:0 0 auto; border-radius:10px; display:grid; place-items:center;\n  background:var(--brand-tint); color:var(--brand); transition:all var(--base); }\n.sect.complete .sect-ico{ background:var(--brand); color:#fff; }\n.sect-nm{ flex:1; font-size:14.5px; font-weight:700; letter-spacing:-.015em; }\n.sect-ct{ font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--ink-4);\n  font-variant-numeric:tabular-nums; }\n.sect.complete .sect-ct{ color:var(--brand); }\n\n/* ───────── ROWS ───────── */\n.row{ border-bottom:1px solid var(--line-2); scroll-margin-top:calc(var(--header-h) + 14px); }\n.row:last-child{ border-bottom:0; }\n.row-hd{ width:100%; display:flex; align-items:center; gap:12px; text-align:left;\n  padding:15px 18px; background:transparent; border:none; cursor:pointer;\n  font-family:inherit; color:inherit; transition:background var(--fast) var(--ease); }\n.row-hd:hover, .row.open > .row-hd{ background:var(--surface-2); }\n.dot{ width:19px; height:19px; flex:0 0 auto; border-radius:50%; position:relative;\n  border:1.8px solid var(--line); transition:all var(--base) var(--spring); }\n.row.set .dot{ border-color:var(--brand); background:var(--brand); }\n.dot svg{ position:absolute; inset:0; margin:auto; width:11px; height:11px; color:#fff;\n  opacity:0; transform:scale(.4); transition:all var(--base) var(--spring); }\n.row.set .dot svg{ opacity:1; transform:scale(1); }\n.row.open .dot{ border-color:var(--brand); }\n.row-txt{ flex:1; min-width:0; }\n.row-lbl{ font-size:15px; font-weight:600; letter-spacing:-.015em; display:block; }\n.row-hint{ font-size:12.5px; color:var(--ink-4); display:block; margin-top:1px;\n  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.r
