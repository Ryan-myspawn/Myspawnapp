<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#060B18}
.canvas{position:relative;width:1080px;height:1350px}
.photo{position:absolute;inset:0;width:1080px;height:1350px;object-fit:cover;object-position:center 28%;filter:saturate(.75) brightness(.84) contrast(1.05)}
.tint{position:absolute;inset:0;background:rgba(10,14,34,.36);mix-blend-mode:multiply}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,11,24,.55) 0%,rgba(6,11,24,0) 26%,rgba(6,11,24,.1) 50%,rgba(6,11,24,.94) 76%,#060B18 100%)}
.wordmark{position:absolute;top:64px;left:72px;color:#fff;font-size:30px;font-weight:800;letter-spacing:.02em;z-index:5}
.wordmark span{color:#A78BFA}
.head{position:absolute;left:72px;bottom:280px;width:940px;color:#fff;font-size:70px;font-weight:800;line-height:1.06;letter-spacing:-.02em;z-index:5}
.head em{font-style:normal;color:#A78BFA}
.sub{position:absolute;left:76px;bottom:196px;width:900px;color:#C7CBDE;font-size:33px;font-weight:500;line-height:1.35;z-index:5}
.rule{position:absolute;left:76px;bottom:150px;width:64px;height:4px;background:#7C3AED;z-index:5}
.lockup{position:absolute;left:76px;bottom:84px;color:#8B90A8;font-size:26px;font-weight:600;letter-spacing:.04em;z-index:5}
.lockup b{color:#fff;font-weight:700}
</style></head><body><div class="canvas">
<img class="photo" src="src_watch.jpg">
<div class="tint"></div>
<div class="grad"></div>
<div class="wordmark">My<span>Spawn</span></div>
<div class="head">The watch survives.<br><em>The watchmaker doesn't.</em></div>
<div class="sub">Heirlooms carry memory. Only one record carries you.</div>
<div class="rule"></div>
<div class="lockup"><b>myspawn.me</b> &nbsp;·&nbsp; $99/yr &nbsp;·&nbsp; storage only</div>
</div></body></html>
