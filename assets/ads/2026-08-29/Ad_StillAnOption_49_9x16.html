<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:#060B18}
.canvas{position:relative;width:1080px;height:1920px}
.photo{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;object-position:center 12%;filter:saturate(.62) brightness(.86) contrast(1.04)}
.tint{position:absolute;inset:0;background:rgba(15,23,52,.44);mix-blend-mode:multiply}
.tint2{position:absolute;inset:0;background:rgba(30,32,74,.16)}
.grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,11,24,.5) 0%,rgba(6,11,24,0) 24%,rgba(6,11,24,0) 48%,rgba(6,11,24,.9) 80%,#060B18 100%)}
.wordmark{position:absolute;top:64px;left:72px;color:#fff;font-size:30px;font-weight:800;letter-spacing:.02em;z-index:5}
.wordmark span{color:#A78BFA}
.head{position:absolute;left:72px;bottom:272px;width:940px;color:#fff;font-size:84px;font-weight:800;line-height:1.06;letter-spacing:-.02em;z-index:5}
.head em{font-style:normal;color:#A78BFA}
.sub{position:absolute;left:76px;bottom:196px;width:880px;color:#C7CBDE;font-size:33px;font-weight:500;line-height:1.3;z-index:5}
.rule{position:absolute;left:76px;bottom:150px;width:64px;height:4px;background:#7C3AED;z-index:5}
.lockup{position:absolute;left:76px;bottom:84px;color:#8B90A8;font-size:26px;font-weight:600;letter-spacing:.04em;z-index:5}
.lockup b{color:#fff;font-weight:700}
</style></head><body><div class="canvas">
<img class="photo" src="../unsplash_ads/src_man.jpg">
<div class="tint"></div>
<div class="tint2"></div>
<div class="grad"></div>
<div class="wordmark">My<span>Spawn</span></div>
<div class="head">No kids.<br><em>Still an option.</em></div>
<div class="sub">Store your DNA before the window closes.</div>
<div class="rule"></div>
<div class="lockup"><b>myspawn.me</b> &nbsp;·&nbsp; $99/yr</div>
</div></body></html>
