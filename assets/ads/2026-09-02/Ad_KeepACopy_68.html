.sub{position:absolute;left:66px;bottom:158px;width:920px;color:#C7CBDE;font-size:30px;font-weight:500;line-height:1.34;z-index:5}
.rule{position:absolute;left:66px;bottom:118px;width:64px;height:4px;background:#7C3AED;z-index:5}
.lockup{position:absolute;left:66px;bottom:62px;color:#8B90A8;font-size:25px;font-weight:600;letter-spacing:.04em;z-index:5}
